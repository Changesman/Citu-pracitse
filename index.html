            <div class="chip-row">
              ${['auto', 'light', 'dark'].map(t => `<button class="chip ${s.theme === t ? 'active' : ''}" data-action="set-theme" data-theme="${t}">${t === 'auto' ? '跟随系统' : t === 'light' ? '浅色' : '深色'}</button>`).join('')}
            </div>
          </div>
        </section>

        <section class="card setting-card">
          <div class="card-head"><div><h3 class="card-title">数据管理</h3><div class="card-sub">所有进度只保存在当前浏览器。换设备或清理浏览器前，记得先导出。</div></div></div>
          <div class="row-between small" style="padding:9px 0"><span class="muted">当前占用</span><b>${(usedBytes / 1024).toFixed(1)} KB</b></div>
          <div class="row-between small" style="padding:9px 0"><span class="muted">学习记录</span><b>${Object.keys(state.words).length} 个单词 · ${Object.keys(state.phrases).length} 个词组 · ${Object.keys(state.sentences).length} 句翻译</b></div>
          <div class="row-between small" style="padding:9px 0"><span class="muted">错题数量</span><b>${Object.keys(state.wrong).length} 条</b></div>
          <div class="data-actions">
            <button class="btn btn-primary btn-sm" data-action="export-data">${icon('download')}导出进度</button>
            <button class="btn btn-ghost btn-sm" data-action="import-data">${icon('upload')}导入进度</button>
            <input type="file" id="import-file" accept="application/json,.json" class="hidden">
          </div>
          <div class="insight mt-16"><b>提示：</b>导出的 JSON 包含每日计划、记忆等级、错题和统计。导入会覆盖当前进度，建议先导出一份备份。</div>
        </section>

        <section class="card setting-card">
          <div class="card-head"><div><h3 class="card-title">我的导入词库</h3><div class="card-sub">课本、笔记、真题里的词表都可以导入，和内置词库一起参与背诵、测试与复习。</div></div></div>
          <div class="row-between small" style="padding:9px 0"><span class="muted">已导入</span><b>${customDeck().words.length} 个单词 · ${customDeck().phrases.length} 个词组 · ${customDeck().sentences.length} 句翻译</b></div>
          <div class="row-between small" style="padding:9px 0"><span class="muted">导入批次</span><b>${customDeck().batches.length} 批</b></div>
          <div class="data-actions">
            <button class="btn btn-primary btn-sm" data-route="import">${icon('upload')}导入新的词语和短语</button>
            <button class="btn btn-ghost btn-sm" data-action="export-imports">${icon('download')}导出我的词库</button>
          </div>
        </section>

        <section class="card setting-card danger-zone">
          <div class="card-head"><div><h3 class="card-title">危险操作</h3><div class="card-sub">以下操作不可撤销，请确认后再执行。</div></div></div>
          <div class="data-actions">
            <button class="btn btn-danger btn-sm" data-action="clear-wrong">清空错题本</button>
            <button class="btn btn-danger btn-sm" data-action="reset-data">重置全部进度</button>
          </div>
        </section>

        <section class="card setting-card">
          <div class="card-head"><div><h3 class="card-title">关于词途</h3><div class="card-sub">纯前端 · 无后端 · 数据存 localStorage</div></div></div>
          <p class="small muted" style="margin:0;line-height:1.8">内容基于《英语四级核心词》内文、《大学英语四六级常用词组》与中国文化翻译资料整理。单词释义参考公开 CET4 词库，形近词与翻译参考译文经过重新编排。发音由浏览器语音合成提供，离线可用（部分浏览器首次需要加载系统语音）。</p>
          <div class="row wrap mt-12"><span class="tag">${WORDS.length} 核心词</span><span class="tag">${PHRASES.length} 词组</span><span class="tag">${TERMS.length} 文化术语</span><span class="tag">${SENTENCES.length} 句翻译</span><span class="tag">${EXAMS.length} 篇真题</span></div>
        </section>
      </div>`;
  }

  function settingNumber(label, desc, key, value, min, max, step) {
    return `<div class="setting-row">
      <div class="setting-info"><b>${label}</b><span>${desc}</span></div>
      <div class="number-control">
        <button data-action="step-setting" data-key="${key}" data-delta="-${step}" aria-label="减少">−</button>
        <input type="number" data-setting-input="${key}" value="${value}" min="${min}" max="${max}" step="${step}">
        <button data-action="step-setting" data-key="${key}" data-delta="${step}" aria-label="增加">+</button>
      </div>
    </div>`;
  }

  function updateSetting(key, value) {
    const limits = { dailyWords: [5, 100], dailyPhrases: [0, 50], dailyTranslations: [0, 10], reviewLimit: [0, 80] };
    if (!limits[key]) return;
    const n = clamp(Number(value) || 0, limits[key][0], limits[key][1]);
    state.settings[key] = n;
    save();
  }

  function stepSetting(key, delta) {
    updateSetting(key, (state.settings[key] || 0) + Number(delta));
    render();
  }

  function exportData() {
    const payload = { app: 'wordway-cet4', version: 1, exportedAt: new Date().toISOString(), data: state };
    download(`词途CET4-备份-${todayKey()}.json`, JSON.stringify(payload, null, 2));
    toast('备份已导出');
  }

  function importData(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(String(reader.result));
        const incoming = parsed.data || parsed;
        if (!incoming || typeof incoming !== 'object' || !incoming.settings) throw new Error('格式不正确');
        if (!confirm('导入会覆盖当前进度，确定继续吗？')) return;
        state = mergeState(defaultState(), incoming);
        save();
        ui.reveal = false;
        render();
        toast('进度已导入');
      } catch (err) {
        toast('导入失败：不是有效的备份文件');
      }
    };
    reader.readAsText(file);
  }

  function resetToday() {
    if (!confirm('重新生成今日计划会清空今天的完成记录（学习等级和错题保留），确定吗？')) return;
    resetDaily();
    ui.reveal = false;
    render();
    toast('今日计划已重新生成');
  }

  function resetAll() {
    if (!confirm('这会清空全部学习进度、错题和统计，且无法恢复。确定重置吗？')) return;
    if (!confirm('最后确认一次：真的要清空吗？建议先导出备份。')) return;
    state = defaultState();
    save();
    ui.quiz = null;
    ui.reveal = false;
    render();
    toast('已重置全部进度');
  }


  /* ---------------- actions & events ---------------- */

  function currentTerm() {
    initTermOrder();
    return TERM_BY_ID.get(ui.termOrder[ui.termPos % ui.termOrder.length]);
  }

  function markDaily(kind, id) {
    const d = getDaily();
    if (['w', 'r', 'p', 's'].includes(kind) && !d.done[kind].includes(id)) {
      d.done[kind].push(id);
      save();
    }
  }

  function continueStudy() {
    const d = getDaily();
    if (d.w.some(id => !d.done.w.includes(id))) {
      ui.wordsScope = 'today';
      ui.reveal = false;
      navigate('words');
      return;
    }
    if (d.r.some(id => !d.done.r.includes(id))) {
      ui.wordsScope = 'review';
      ui.reveal = false;
      navigate('words');
      return;
    }
    if (d.p.some(id => !d.done.p.includes(id))) {
      ui.reveal = false;
      navigate('phrases');
      return;
    }
    if (d.s.some(id => !d.done.s.includes(id))) {
      navigate('translate');
      return;
    }
    if (dueWordIds().length) {
      ui.wordsScope = 'review';
      ui.reveal = false;
      navigate('words');
      return;
    }
    startQuiz('wrong', 'mixed', 10);
  }

  function exportWrong() {
    const list = wrongList(true);
    if (!list.length) { toast('错题本是空的'); return; }
    const head = ['类型', '题目', '正确答案', '你的答案', '错误类型', '错误次数', '是否掌握'];
    const rows = list.map(w => [
      TYPE_LABEL[w.type] || w.type, w.prompt, w.correct, w.your || '', w.tag || '', String(w.count), w.mastered ? '已攻克' : '待复习'
    ]);
    const csv = '\ufeff' + [head, ...rows].map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\r\n');
    download(`词途CET4-错题-${todayKey()}.csv`, csv, 'text/csv;charset=utf-8');
    toast('错题已导出');
  }

  function handleAction(el) {
    const action = el.dataset.action;
    const id = Number(el.dataset.id);
    const d = getDaily();
    switch (action) {
      case 'toggle-theme':
        state.settings.theme = themeIsDark() ? 'light' : 'dark';
        save(); applyTheme(); render();
        break;
      case 'continue-study':
        continueStudy();
        break;
      case 'words-tab':
        ui.wordsTab = el.dataset.tab; render();
        break;
      case 'phrases-tab':
        ui.phrasesTab = el.dataset.tab; render();
        break;
      case 'word-scope':
        ui.wordsScope = el.dataset.scope; ui.reveal = false; render();
        break;
      case 'phrase-scope':
        ui.phrasesScope = el.dataset.scope; ui.reveal = false; render();
        break;
      case 'reveal':
        ui.reveal = !ui.reveal; render();
        break;
      case 'speak':
        speak(el.dataset.text || '');
        break;
      case 'rate-word': {
        const w = wordQueue(ui.wordsScope)[0];
        if (!w) return;
        const q = Number(el.dataset.q);
        reviewWord(w.id, q);
        markDaily(ui.wordsScope === 'review' ? 'r' : 'w', w.id);
        if (q === 0) addWrong({ type: 'word', refId: w.id, prompt: w.w, correct: w.m, your: '不认识', tag: '词义不清' });
        ui.reveal = false;
        render();
        break;
      }
      case 'rate-phrase': {
        const p = phraseQueue('today')[0];
        if (!p) return;
        const q = Number(el.dataset.q);
        reviewPhrase(p.id, q);
        markDaily('p', p.id);
        if (q === 0) addWrong({ type: 'phrase', refId: p.id, prompt: p.p, correct: p.m, your: '没印象', tag: '固定搭配' });
        ui.reveal = false;
        render();
        break;
      }
      case 'lib-word':
        openWordModal(id);
        break;
      case 'lib-phrase':
        openPhraseModal(id);
        break;
      case 'close-modal':
        closeModal();
        break;
      case 'word-make-due': {
        const now = Date.now();
        const s = state.words[id] || { seen: 1, correct: 0, wrong: 0, level: 1, due: now, last: now };
        s.due = now;
        s.seen = Math.max(1, s.seen || 1);
        state.words[id] = s;
        save(); closeModal(); toast('已加入待复习队列');
        break;
      }
      case 'phrase-make-due': {
        const now = Date.now();
        const s = state.phrases[id] || { seen: 1, correct: 0, wrong: 0, level: 1, due: now, last: now };
        s.due = now;
        s.seen = Math.max(1, s.seen || 1);
        state.phrases[id] = s;
        save(); closeModal(); toast('已加入待复习队列');
        break;
      }
      case 'quiz-scope':
        ui.quizConfig.scope = el.dataset.scope;
        if (el.dataset.go === 'quiz') {
          navigate('quiz');
        } else render();
        break;
      case 'quiz-type':
        ui.quizConfig.type = el.dataset.type; render();
        break;
      case 'quiz-count':
        ui.quizConfig.count = Number(el.dataset.count); render();
        break;
      case 'start-quiz':
        startQuiz(ui.quizConfig.scope, ui.quizConfig.type, ui.quizConfig.count);
        break;
      case 'start-term-quiz':
        ui.quizConfig.scope = 'terms';
        ui.quizConfig.type = 'meaning';
        ui.quizConfig.count = 10;
        startQuiz('terms', 'meaning', 10);
        break;
      case 'quiz-answer':
        answerQuiz(el.dataset.index);
        break;
      case 'quiz-next':
        nextQuiz();
        break;
      case 'quiz-exit':
        ui.quiz = null; ui.quizInput = ''; render();
        break;
      case 'quiz-retry':
        if (ui.quiz) startQuiz(ui.quiz.scope, ui.quiz.type, ui.quiz.total);
        break;
      case 'translate-tab':
        ui.translateTab = el.dataset.tab;
        ui.sentenceRevealed = false;
        if (el.dataset.tab !== 'exam') {
          ui.examId = null;
          ui.examRevealed = false;
        }
        render();
        break;
      case 'goto-exam':
        ui.translateTab = 'exam';
        ui.examId = null;
        ui.examRevealed = false;
        render();
        break;
      case 'exam-open': {
        const ex = EXAM_BY_ID.get(Number(el.dataset.id));
        if (!ex) return;
        ui.translateTab = 'exam';
        ui.examId = ex.id;
        ui.examDraft = '';
        ui.examRevealed = false;
        ui.translateTab = 'exam';
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
        break;
      }
      case 'exam-back':
        ui.examId = null;
        ui.examRevealed = false;
        render();
        break;
      case 'exam-filter':
        ui.examFilter = el.dataset.filter;
        render();
        break;
      case 'exam-reveal':
        ui.examRevealed = true;
        render();
        break;
      case 'exam-skip': {
        if (ui.examId == null) return;
        const cur = EXAM_BY_ID.get(ui.examId);
        const idx = EXAMS.findIndex(x => x.id === (cur ? cur.id : -1));
        const next = EXAMS[(idx + 1) % EXAMS.length];
        ui.examId = next.id;
        ui.examDraft = '';
        ui.examRevealed = false;
        render();
        break;
      }
      case 'exam-good':
      case 'exam-bad': {
        if (ui.examId == null) return;
        const good = action === 'exam-good';
        reviewExam(ui.examId, good);
        if (!good) {
          const ex = EXAM_BY_ID.get(ui.examId);
          if (ex) addWrong({ type: 'sentence', refId: 'exam' + ex.id, prompt: ex.topic + ' · ' + ex.zh.slice(0, 26), correct: ex.en, your: ui.examDraft || '（未作答）', tag: '翻译表达' });
        }
        const cur = EXAM_BY_ID.get(ui.examId);
        const idx = EXAMS.findIndex(x => x.id === (cur ? cur.id : -1));
        const next = EXAMS[(idx + 1) % EXAMS.length];
        ui.examId = next.id;
        ui.examDraft = '';
        ui.examRevealed = false;
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
        toast(good ? '已记入学习数据' : '没关系，下一篇继续');
        break;
      }
      case 'exam-random': {
        const pool = examList();
        if (!pool.length) return;
        const ex = pick(pool);
        ui.translateTab = 'exam';
        ui.examId = ex.id;
        ui.examDraft = '';
        ui.examRevealed = false;
        render();
        window.scrollTo({ top: 0, behavior: 'auto' });
        break;
      }
      case 'exam-copy': {
        const ex = ui.examId != null ? EXAM_BY_ID.get(ui.examId) : null;
        if (!ex) return;
        copyText(ex.en);
        break;
      }
      case 'pick-import-file': {
        const f = $('#deck-file');
        if (f) f.click();
        break;
      }
      case 'parse-paste': {
        const ta = $('#import-paste');
        const text = (ta ? ta.value : '') || ui.importText || '';
        if (!text.trim()) { toast('先粘贴一些单词或句子'); return; }
        ui.importText = text;
        handleImportText(text, '粘贴的文本');
        break;
      }
      case 'import-target':
        ui.importTarget = el.dataset.target;
        render();
        break;
      case 'cancel-import':
        ui.importPhase = 'idle';
        ui.importRows = [];
        ui.importErrors = [];
        ui.importName = '';
        ui.importText = '';
        render();
        break;
      case 'commit-import':
        commitImport();
        break;
      case 'download-template':
        downloadTemplate(el.dataset.kind);
        break;
      case 'delete-batch':
        deleteBatch(el.dataset.batch);
        break;
      case 'clear-imports':
        clearImports();
        break;
      case 'export-imports':
        exportImports();
        break;
      case 'sentence-reveal':
        ui.sentenceRevealed = true; render();
        break;
      case 'sentence-skip': {
        const s = currentSentence();
        if (s) {
          const idx = d.s.indexOf(s.id);
          if (idx >= 0) { d.s.splice(idx, 1); d.s.push(s.id); }
          ui.sentenceRevealed = false;
          ui.sentenceDraft = '';
          save(); render();
        }
        break;
      }
      case 'sentence-good':
      case 'sentence-bad': {
        const s = currentSentence();
        if (!s) return;
        const good = action === 'sentence-good';
        reviewSentence(s.id, good);
        markDaily('s', s.id);
        if (!good) addWrong({ type: 'sentence', refId: s.id, prompt: s.zh, correct: s.en, your: ui.sentenceDraft || '（未作答）', tag: '翻译表达' });
        ui.sentenceRevealed = false;
        ui.sentenceDraft = '';
        render();
        break;
      }
      case 'term-reveal':
        ui.termRevealed = true; render();
        break;
      case 'term-good':
      case 'term-bad': {
        const t = currentTerm();
        if (!t) return;
        const good = action === 'term-good';
        reviewTerm(t.id, good);
        if (!good) addWrong({ type: 'term', refId: t.id, prompt: t.zh, correct: t.en, your: '未想起', tag: '文化术语' });
        ui.termPos = (ui.termPos + 1) % Math.max(1, TERMS.length);
        ui.termRevealed = false;
        save(); render();
        break;
      }
      case 'notebook-filter':
        ui.notebookFilter = el.dataset.filter; render();
        break;
      case 'toggle-wrong': {
        const key = el.dataset.key;
        ui.notebookOpen = ui.notebookOpen === key ? '' : key;
        render();
        break;
      }
      case 'master-wrong': {
        const w = state.wrong[el.dataset.key];
        if (w) { w.mastered = true; w.right = 2; save(); render(); toast('已标记掌握'); }
        break;
      }
      case 'delete-wrong':
        delete state.wrong[el.dataset.key];
        save(); render(); toast('已删除');
        break;
      case 'practice-wrong':
        startQuiz('wrong', 'mixed', 20);
        break;
      case 'clear-mastered':
        Object.keys(state.wrong).forEach(k => { if (state.wrong[k].mastered) delete state.wrong[k]; });
        save(); render(); toast('已清空已攻克的错题');
        break;
      case 'export-wrong':
        exportWrong();
        break;
      case 'step-setting':
        stepSetting(el.dataset.key, Number(el.dataset.delta));
        break;
      case 'set-theme':
        state.settings.theme = el.dataset.theme;
        save(); applyTheme(); render();
        break;
      case 'toggle-sound':
        state.settings.sound = !state.settings.sound;
        save(); render();
        if (state.settings.sound) speak('Sound on');
        break;
      case 'export-data':
        exportData();
        break;
      case 'import-data': {
        const f = $('#import-file');
        if (f) f.click();
        break;
      }
      case 'reset-today':
        resetToday();
        break;
      case 'reset-data':
        resetAll();
        break;
      case 'clear-wrong':
        if (!confirm('确定清空全部错题吗？此操作不可撤销。')) return;
        state.wrong = {};
        save(); render(); toast('错题本已清空');
        break;
      default:
        break;
    }
  }

  document.addEventListener('click', (e) => {
    if (e.target.classList && e.target.classList.contains('modal-mask')) {
      closeModal();
      return;
    }
    const actionEl = e.target.closest('[data-action]');
    if (actionEl) {
      e.preventDefault();
      handleAction(actionEl);
      if (actionEl.dataset.route && parseHash() !== actionEl.dataset.route) {
        navigate(actionEl.dataset.route);
      }
      return;
    }
    const routeEl = e.target.closest('[data-route]');
    if (routeEl) {
      e.preventDefault();
      navigate(routeEl.dataset.route);
    }
  });

  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'lib-search') {
      ui.libSearch = t.value;
      refreshLibrary();
    } else if (t.id === 'phrase-search') {
      ui.phraseSearch = t.value;
      refreshPhraseLibrary();
    } else if (t.id === 'sentence-input') {
      ui.sentenceDraft = t.value;
    } else if (t.id === 'exam-input') {
      ui.examDraft = t.value;
    } else if (t.id === 'import-paste') {
      ui.importText = t.value;
    } else if (t.id === 'quiz-spell') {
      ui.quizInput = t.value;
    } else if (t.dataset && t.dataset.settingInput) {
      updateSetting(t.dataset.settingInput, t.value);
    }
  });

  document.addEventListener('change', (e) => {
    if (e.target.id === 'import-file') {
      importData(e.target.files && e.target.files[0]);
      e.target.value = '';
    } else if (e.target.id === 'deck-file') {
      const f = e.target.files && e.target.files[0];
      readImportFile(f);
      e.target.value = '';
    }
  });

  document.addEventListener('dragover', (e) => {
    const zone = e.target.closest && e.target.closest('#dropzone');
    if (!zone) return;
    e.preventDefault();
    zone.classList.add('over');
  });

  document.addEventListener('dragleave', (e) => {
    const zone = e.target.closest && e.target.closest('#dropzone');
    if (!zone) return;
    zone.classList.remove('over');
  });

  document.addEventListener('drop', (e) => {
    const zone = e.target.closest && e.target.closest('#dropzone');
    if (!zone) return;
    e.preventDefault();
    zone.classList.remove('over');
    const files = e.dataTransfer && e.dataTransfer.files;
    if (files && files.length) {
      readImportFile(files[0]);
    } else {
      const text = e.dataTransfer ? e.dataTransfer.getData('text/plain') : '';
      if (text && text.trim()) handleImportText(text, '拖入的文本');
    }
  });

  document.addEventListener('submit', (e) => {
    if (e.target.id === 'spell-form') {
      e.preventDefault();
      if (ui.quiz && !ui.quiz.questions[ui.quiz.idx].answered) answerQuiz(-1);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (modalRoot.innerHTML) { closeModal(); return; }
      if (ui.quiz && !ui.quiz.finished) { ui.quiz = null; render(); return; }
    }
    if (modalRoot.innerHTML) return;
    const tag = (e.target.tagName || '').toLowerCase();
    const typing = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
    if (typing) {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        if (ui.route === 'translate' && ui.translateTab === 'sentence' && !ui.sentenceRevealed) {
          e.preventDefault(); ui.sentenceRevealed = true; render();
        }
      }
      return;
    }
    if (ui.route === 'words' && ui.wordsTab === 'study') {
      if (e.code === 'Space') {
        e.preventDefault();
        ui.reveal = !ui.reveal; render(); return;
      }
      if (ui.reveal && ['1', '2', '3'].includes(e.key)) {
        e.preventDefault();
        const q = Number(e.key) - 1;
        const w = wordQueue(ui.wordsScope)[0];
        if (!w) return;
        reviewWord(w.id, q);
        markDaily(ui.wordsScope === 'review' ? 'r' : 'w', w.id);
        if (q === 0) addWrong({ type: 'word', refId: w.id, prompt: w.w, correct: w.m, your: '不认识', tag: '词义不清' });
        ui.reveal = false; render(); return;
      }
    }
    if (ui.route === 'phrases' && ui.phrasesTab === 'study') {
      if (e.code === 'Space') {
        e.preventDefault();
        ui.reveal = !ui.reveal; render(); return;
      }
      if (ui.reveal && ['1', '2', '3'].includes(e.key)) {
        e.preventDefault();
        const q = Number(e.key) - 1;
        const p = phraseQueue('today')[0];
        if (!p) return;
        reviewPhrase(p.id, q);
        markDaily('p', p.id);
        if (q === 0) addWrong({ type: 'phrase', refId: p.id, prompt: p.p, correct: p.m, your: '没印象', tag: '固定搭配' });
        ui.reveal = false; render(); return;
      }
    }
    if (ui.route === 'quiz' && ui.quiz && !ui.quiz.finished) {
      const q = ui.quiz.questions[ui.quiz.idx];
      if (!q) return;
      if (q.answered) {
        if (e.key === 'Enter' || e.code === 'Space') { e.preventDefault(); nextQuiz(); }
        return;
      }
      if (!q.spelling && ['1', '2', '3', '4'].includes(e.key)) {
        e.preventDefault();
        answerQuiz(Number(e.key) - 1);
      }
    }
  });

  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    const onChange = () => { if (state.settings.theme === 'auto') { applyTheme(); render(); } };
    if (mq.addEventListener) mq.addEventListener('change', onChange);
    else if (mq.addListener) mq.addListener(onChange);
  }

  let lastRoute = '';
  window.addEventListener('hashchange', () => {
    const r = parseHash();
    if (r !== lastRoute) {
      lastRoute = r;
      ui.reveal = false;
      ui.sentenceRevealed = false;
      closeModal();
      window.scrollTo({ top: 0, behavior: 'auto' });
    }
    render();
  });

  window.addEventListener('storage', (e) => {
    if (e.key !== STORE_KEY || !e.newValue) return;
    try {
      state = mergeState(defaultState(), JSON.parse(e.newValue));
      render();
      toast('进度已从其他标签页同步');
    } catch (err) { /* ignore */ }
  });

  /* ---------------- boot ---------------- */

  function boot() {
    if (!location.hash) {
      history.replaceState(null, '', '#/home');
    }
    lastRoute = parseHash();
    applyTheme();
    getDaily();
    render();
  }

  boot();
})();
</script>
</body>
</html>
