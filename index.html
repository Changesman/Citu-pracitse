<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="词途 CET4：四级核心词、常用词组与文化翻译的离线学习工具。支持每日计划、测试、错题本与形近词辨析。">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='34' fill='%23fffdf8' font-family='serif'%3E%E8%AF%8D%3C/text%3E%3C/svg%3E">
<title>词途 · 四级词汇与翻译</title>
<style>
:root{
  --bg:#f5f1e8;
  --bg-2:#efe9dc;
  --surface:#fffdf8;
  --surface-2:#faf6ec;
  --surface-3:#f1ebdd;
  --ink:#1e2a32;
  --ink-2:#3d4b54;
  --muted:#7b8790;
  --line:#e5ddcd;
  --line-strong:#d6ccb9;
  --primary:#0f766e;
  --primary-2:#0b5f59;
  --primary-soft:#e3f2ef;
  --primary-ink:#0a4f4a;
  --accent:#dd7756;
  --accent-soft:#fbe9e2;
  --gold:#b98a30;
  --gold-soft:#f8edcf;
  --blue:#3d5a80;
  --blue-soft:#e8eef6;
  --red:#b75450;
  --red-soft:#fae9e7;
  --green:#2f7d5c;
  --green-soft:#e4f2e9;
  --shadow:0 12px 32px rgba(76,62,38,.07),0 2px 8px rgba(76,62,38,.04);
  --shadow-lg:0 24px 60px rgba(76,62,38,.12),0 4px 14px rgba(76,62,38,.06);
  --radius:22px;
  --radius-sm:14px;
  --sidebar:244px;
  --font-ui:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Georgia,"Songti SC","STSong",serif;
  --ease:cubic-bezier(.22,.8,.3,1);
}
[data-theme="dark"]{
  --bg:#10171b;
  --bg-2:#0c1216;
  --surface:#172127;
  --surface-2:#1b262d;
  --surface-3:#223039;
  --ink:#eee8da;
  --ink-2:#cbd3d1;
  --muted:#93a0a4;
  --line:#2a373d;
  --line-strong:#3a4a50;
  --primary:#62d9c9;
  --primary-2:#8ce8db;
  --primary-soft:#163833;
  --primary-ink:#8ce8db;
  --accent:#f09572;
  --accent-soft:#3a2520;
  --gold:#e6bd68;
  --gold-soft:#392f1c;
  --blue:#9db8d8;
  --blue-soft:#1e2c3a;
  --red:#f18d86;
  --red-soft:#3a2222;
  --green:#7fd5a8;
  --green-soft:#1b3328;
  --shadow:0 16px 40px rgba(0,0,0,.26),0 2px 8px rgba(0,0,0,.2);
  --shadow-lg:0 30px 70px rgba(0,0,0,.38),0 6px 18px rgba(0,0,0,.24);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:
    radial-gradient(1100px 520px at 82% -8%,rgba(15,118,110,.09),transparent 60%),
    radial-gradient(900px 500px at -8% 102%,rgba(221,119,86,.08),transparent 62%),
    var(--bg);
  color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
[data-theme="dark"] body{background:
  radial-gradient(1100px 520px at 82% -8%,rgba(98,217,201,.07),transparent 60%),
  radial-gradient(900px 500px at -8% 102%,rgba(240,149,114,.06),transparent 62%),
  var(--bg)}
::selection{background:rgba(15,118,110,.2)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg{display:block}
.icon{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.serif{font-family:var(--font-serif)}
.center{text-align:center}
.nowrap{white-space:nowrap}
.grow{flex:1}
.row{display:flex;align-items:center;gap:10px}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:14px}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}.mt-20{margin-top:20px}.mt-24{margin-top:24px}
.mb-8{margin-bottom:8px}.mb-12{margin-bottom:12px}.mb-16{margin-bottom:16px}.mb-20{margin-bottom:20px}

/* ---------- shell ---------- */
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar);z-index:40;
  padding:26px 18px 20px;display:flex;flex-direction:column;
  background:color-mix(in srgb,var(--surface) 88%,transparent);
  border-right:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.brand{display:flex;align-items:center;gap:12px;padding:2px 8px 24px}
.brand-mark{
  width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
  background:var(--ink);color:var(--surface);font-family:var(--font-serif);
  font-size:23px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);
  position:relative;overflow:hidden;
}
.brand-mark::after{content:"";position:absolute;width:28px;height:28px;border:1px solid rgba(255,255,255,.22);border-radius:50%;right:-10px;bottom:-11px}
.brand-name{font-family:var(--font-serif);font-size:20px;font-weight:700;letter-spacing:.5px;line-height:1.15}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;margin-top:3px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11px;letter-spacing:1.3px;color:var(--muted);margin:8px 12px 6px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;
  color:var(--ink-2);font-size:14px;transition:.18s var(--ease);position:relative;
}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.active{background:var(--primary-soft);color:var(--primary-ink);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-18px;top:50%;width:3px;height:20px;border-radius:0 3px 3px 0;background:var(--primary);transform:translateY(-50%)}
.nav-item .badge{margin-left:auto;background:var(--accent);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;min-width:20px;text-align:center;font-weight:600}
.sidebar-foot{margin-top:auto;padding:16px 10px 0;border-top:1px solid var(--line)}
.streak-mini{display:flex;align-items:center;gap:11px}
.flame{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.streak-mini strong{display:block;font-size:17px;line-height:1.2}
.streak-mini span{font-size:11px;color:var(--muted)}
.sidebar-actions{display:flex;gap:6px;margin-top:14px}
.side-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);background:var(--surface-2);border:1px solid var(--line)}
.side-btn:hover{color:var(--ink);border-color:var(--line-strong)}

.mobile-header{
  display:none;position:fixed;top:0;left:0;right:0;height:60px;z-index:35;
  align-items:center;justify-content:space-between;padding:0 16px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.mobile-brand{display:flex;align-items:center;gap:9px}
.mobile-brand .brand-mark{width:34px;height:34px;border-radius:10px;font-size:18px}
.mobile-brand b{font-family:var(--font-serif);font-size:17px}
.mobile-actions{display:flex;gap:4px}
.mobile-actions .side-btn{background:transparent;border:0}
.bottom-nav{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:36;
  grid-template-columns:repeat(6,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  border-top:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
}
.bnav{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0;border-radius:12px;color:var(--muted);font-size:10px}
.bnav .icon{width:21px;height:21px}
.bnav.active{color:var(--primary);background:var(--primary-soft)}
.main{
  margin-left:var(--sidebar);min-height:100vh;padding:26px 38px 70px;
  max-width:1500px;margin-right:auto;
}
.page{animation:pageIn .32s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
.page-eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.page-title{font-family:var(--font-serif);font-size:31px;line-height:1.2;margin:0;letter-spacing:-.3px}
.page-desc{color:var(--muted);font-size:13px;margin-top:5px}
.top-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.pill-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);box-shadow:0 1px 2px rgba(0,0,0,.02)}
.pill-btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.pill-btn .icon{width:16px;height:16px}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:22px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:650;letter-spacing:.1px;margin:0}
.card-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.section-title{font-family:var(--font-serif);font-size:21px;margin:0 0 4px}
.section-sub{font-size:13px;color:var(--muted);margin:0}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:13px;padding:10px 17px;border:1px solid transparent;
  background:var(--surface-3);color:var(--ink);font-size:13.5px;font-weight:600;
  transition:.18s var(--ease);white-space:nowrap;
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn .icon{width:17px;height:17px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 8px 20px rgba(15,118,110,.22)}
[data-theme="dark"] .btn-primary{color:#082f2b;box-shadow:none}
.btn-primary:hover{background:var(--primary-2)}
.btn-accent{background:var(--accent);color:#fff;box-shadow:0 8px 20px rgba(221,119,86,.2)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn-soft{background:var(--primary-soft);color:var(--primary-ink)}
.btn-danger{background:var(--red-soft);color:var(--red)}
.btn-lg{padding:13px 22px;font-size:14.5px;border-radius:15px}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.icon-btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);font-size:11px;font-weight:550;line-height:1.6;white-space:nowrap}
.tag-green{background:var(--green-soft);color:var(--green)}
.tag-red{background:var(--red-soft);color:var(--red)}
.tag-gold{background:var(--gold-soft);color:var(--gold)}
.tag-blue{background:var(--blue-soft);color:var(--blue)}
.tag-teal{background:var(--primary-soft);color:var(--primary-ink)}
.tag-accent{background:var(--accent-soft);color:var(--accent)}
.chip{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:12.5px;
  transition:.16s var(--ease);white-space:nowrap;
}
.chip:hover{border-color:var(--line-strong)}
.chip.active{background:var(--ink);border-color:var(--ink);color:var(--surface)}
[data-theme="dark"] .chip.active{background:var(--primary);border-color:var(--primary);color:#082f2b}
.chip-row{display:flex;flex-wrap:wrap;gap:8px}
.divider{height:1px;background:var(--line);margin:16px 0}
.progress{height:7px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.progress>i{display:block;height:100%;border-radius:99px;background:var(--primary);transition:width .4s var(--ease)}
.progress.accent>i{background:var(--accent)}
.progress.gold>i{background:var(--gold)}
.metric{display:flex;flex-direction:column;gap:2px}
.metric b{font-family:var(--font-serif);font-size:26px;line-height:1.15;font-weight:700}
.metric span{font-size:11.5px;color:var(--muted)}
.empty{padding:38px 20px;text-align:center;color:var(--muted)}
.empty .empty-icon{width:52px;height:52px;border-radius:16px;margin:0 auto 12px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.empty h4{margin:0 0 4px;color:var(--ink);font-size:15px}
.empty p{margin:0;font-size:12.5px}

/* ---------- home ---------- */
.home-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.8fr);gap:18px;align-items:start}
.hero{position:relative;overflow:hidden;padding:28px 30px;border-radius:26px;background:var(--ink);color:#f7f2e8;box-shadow:var(--shadow-lg);min-height:242px}
.hero::before{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(98,217,201,.28),transparent 68%);right:-70px;top:-100px}
.hero::after{content:"";position:absolute;width:230px;height:230px;border:1px solid rgba(247,242,232,.14);border-radius:50%;right:28px;bottom:-160px}
.hero .eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:rgba(247,242,232,.55)}
.hero h1{font-family:var(--font-serif);font-size:clamp(27px,3.2vw,40px);line-height:1.18;margin:8px 0 6px;letter-spacing:-.4px;max-width:520px}
.hero p{margin:0;color:rgba(247,242,232,.68);font-size:13.5px;max-width:480px}
.hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:24px;position:relative;z-index:1}
.hero .btn-primary{background:#f7f2e8;color:#16262a;box-shadow:none}
.hero .btn-primary:hover{background:#fff}
.hero .btn-ghost{border-color:rgba(247,242,232,.25);color:#f7f2e8}
.hero .btn-ghost:hover{background:rgba(255,255,255,.08)}
.ring{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;position:relative;flex:0 0 auto;background:conic-gradient(#79dfd0 calc(var(--p,0)*1%),rgba(255,255,255,.14) 0)}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:#1d2b31}
[data-theme="dark"] .ring::before{background:#162126}
.ring-inner{position:relative;text-align:center;line-height:1.1}
.ring-inner b{font-family:var(--font-serif);font-size:23px;display:block}
.ring-inner span{font-size:9.5px;color:rgba(247,242,232,.55);letter-spacing:.6px}
.streak-card{padding:23px;display:flex;flex-direction:column;gap:15px;min-height:242px;background:linear-gradient(150deg,var(--surface),var(--surface-2))}
.streak-top{display:flex;align-items:flex-start;justify-content:space-between}
.streak-big{display:flex;align-items:baseline;gap:8px;margin-top:6px}
.streak-big b{font-family:var(--font-serif);font-size:44px;line-height:1;color:var(--accent)}
.streak-big span{font-size:12px;color:var(--muted)}
.week-dots{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:4px}
.day-dot{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9.5px;color:var(--muted)}
.day-dot i{width:25px;height:25px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-style:normal;font-size:10px;color:var(--muted)}
.day-dot i.on{background:var(--primary);color:#fff}
[data-theme="dark"] .day-dot i.on{color:#082f2b}
.day-dot i.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--primary)}
.task-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:18px}
.task-card{padding:18px;display:flex;flex-direction:column;gap:11px;position:relative;overflow:hidden;transition:.2s var(--ease)}
.task-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.task-ico{width:37px;height:37px;border-radius:12px;display:grid;place-items:center;background:var(--primary-soft);color:var(--primary-ink)}
.task-card:nth-child(2) .task-ico{background:var(--blue-soft);color:var(--blue)}
.task-card:nth-child(3) .task-ico{background:var(--accent-soft);color:var(--accent)}
.task-card h3{font-size:14.5px;margin:0;font-weight:650}
.task-card .meta{display:flex;align-items:baseline;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.task-card .meta b{color:var(--ink);font-size:13px}
.task-card .go{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--primary);margin-top:1px}
.task-card .go .icon{width:14px;height:14px}
.home-lower{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:18px;margin-top:18px}
.activity-chart{height:150px;display:flex;align-items:flex-end;gap:9px;padding-top:8px}
.act-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.act-bar{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--surface-3);min-height:4px;transition:height .5s var(--ease);position:relative}
.act-bar.on{background:linear-gradient(180deg,var(--primary),#4bb3a5)}
.act-bar .val{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--muted);opacity:0;transition:.2s}
.act-col:hover .val{opacity:1}
.act-col span{font-size:9.5px;color:var(--muted)}
.mini-list{display:flex;flex-direction:column;gap:2px}
.mini-item{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
.mini-item:last-child{border-bottom:0}
.mini-item .mini-ico{width:30px;height:30px;border-radius:9px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;font-size:12px;font-weight:700;flex:0 0 auto}
.mini-item .mini-main{min-width:0;flex:1}
.mini-item b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-item span{display:block;font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.similar-mini{display:flex;flex-wrap:wrap;gap:7px}
.similar-mini span{padding:5px 9px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:11.5px}

/* ---------- study ---------- */
.study-wrap{max-width:880px;margin:0 auto}
.study-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
.study-progress{flex:1;max-width:440px}
.study-progress .row-between{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.flashcard{min-height:430px;padding:36px 40px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;background:
  radial-gradient(600px 260px at 50% -10%,var(--surface-2),transparent 70%),var(--surface)}
.flashcard::before{content:"";position:absolute;left:34px;top:32px;width:24px;height:24px;border-left:1px solid var(--line-strong);border-top:1px solid var(--line-strong);border-radius:8px 0 0 0;opacity:.7}
.flashcard::after{content:"";position:absolute;right:34px;bottom:32px;width:24px;height:24px;border-right:1px solid var(--line-strong);border-bottom:1px solid var(--line-strong);border-radius:0 0 8px 0;opacity:.7}
.fc-toolbar{position:absolute;top:18px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;z-index:2}
.fc-word{font-family:var(--font-serif);font-size:clamp(46px,7vw,72px);line-height:1.05;letter-spacing:-1.2px;text-align:center;word-break:break-word;margin-top:6px}
.fc-phonetic{font-family:Georgia,serif;color:var(--muted);font-size:16px;letter-spacing:.4px;margin-top:12px;display:flex;align-items:center;gap:8px}
.speak-btn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:var(--ink-2);transition:.18s}
.speak-btn:hover{background:var(--primary-soft);color:var(--primary-ink)}
.speak-btn .icon{width:15px;height:15px}
.fc-hint{margin-top:30px;color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:7px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:21px;padding:0 5px;border-radius:5px;border:1px solid var(--line-strong);border-bottom-width:2px;background:var(--surface-2);font-size:10px;color:var(--muted);font-family:var(--font-ui)}
.reveal{margin-top:20px;width:100%;max-width:650px;animation:revealIn .3s var(--ease)}
@keyframes revealIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.reveal-meaning{font-size:19px;line-height:1.7;text-align:center;font-weight:550}
.reveal-pos{font-size:12px;color:var(--muted);margin-top:6px;text-align:center}
.confuse-box{margin-top:18px;background:var(--surface-2);border:1px dashed var(--line-strong);border-radius:15px;padding:14px 16px;text-align:left}
.confuse-title{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:650;color:var(--gold);letter-spacing:.3px;margin-bottom:9px}
.confuse-title .icon{width:14px;height:14px}
.confuse-list{display:grid;gap:7px}
.confuse-item{display:flex;align-items:baseline;gap:9px;font-size:12.5px}
.confuse-item b{font-family:Georgia,serif;font-size:14px;color:var(--ink);min-width:92px}
.confuse-item span{color:var(--muted);font-size:11.5px;line-height:1.5}
.confuse-tip{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--ink-2);line-height:1.55}
.rate-bar{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:10px;margin-top:16px}
.rate-btn{padding:14px 12px;border-radius:15px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:3px;transition:.18s var(--ease)}
.rate-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.rate-btn b{font-size:13.5px}
.rate-btn span{font-size:10px;color:var(--muted)}
.rate-btn.bad{color:var(--red);border-color:color-mix(in srgb,var(--red) 30%,var(--line))}
.rate-btn.bad:hover{background:var(--red-soft)}
.rate-btn.mid{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 30%,var(--line))}
.rate-btn.mid:hover{background:var(--gold-soft)}
.rate-btn.good{background:var(--primary);border-color:var(--primary);color:#fff}
.rate-btn.good:hover{background:var(--primary-2)}
[data-theme="dark"] .rate-btn.good{color:#082f2b}
.finish-card{padding:46px 34px;text-align:center;position:relative;overflow:hidden}
.finish-badge{width:76px;height:76px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;margin:0 auto 18px}
.finish-badge .icon{width:34px;height:34px}
.finish-card h2{font-family:var(--font-serif);font-size:28px;margin:0 0 6px}
.finish-card p{color:var(--muted);margin:0 auto;max-width:460px;font-size:13.5px}
.finish-stats{display:flex;justify-content:center;gap:34px;margin:25px 0}
.finish-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-3);gap:2px}
.seg button{padding:6px 11px;border-radius:9px;font-size:11.5px;color:var(--muted);font-weight:550}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.06)}
.search-box{position:relative;flex:1;max-width:340px}
.search-box .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search-box input{width:100%;padding:9px 12px 9px 36px;border-radius:11px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;outline:none}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:14px}
.lib-item{padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:var(--surface);cursor:pointer;transition:.16s}
.lib-item:hover{border-color:var(--primary);background:var(--surface-2)}
.lib-item .lw{font-family:var(--font-serif);font-size:17px;font-weight:650;display:flex;justify-content:space-between;gap:8px}
.lib-item .lm{font-size:11.5px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib-item .lp{font-size:10.5px;color:var(--muted);font-family:Georgia,serif}
.study-tabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.count-note{font-size:11.5px;color:var(--muted)}

/* ---------- quiz ---------- */
.quiz-start{max-width:900px;margin:0 auto}
.quiz-hero{padding:30px 32px;border-radius:24px;background:linear-gradient(125deg,var(--surface),var(--surface-2));border:1px solid var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden}
.quiz-hero::after{content:"";position:absolute;right:-40px;top:-70px;width:230px;height:230px;border-radius:50%;background:var(--primary-soft);opacity:.55}
.quiz-hero h2{font-family:var(--font-serif);font-size:27px;margin:0 0 5px}
.quiz-hero p{color:var(--muted);margin:0;font-size:13px;max-width:520px}
.scope-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px;position:relative;z-index:1}
.scope-card{padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:.16s}
.scope-card:hover{border-color:var(--line-strong)}
.scope-card.active{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 1px var(--primary)}
.scope-card b{display:block;font-size:13px;margin-bottom:2px}
.scope-card span{font-size:10.5px;color:var(--muted)}
.quiz-config{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.config-box{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.config-box h4{font-size:12.5px;margin:0 0 10px;color:var(--muted);font-weight:600}
.quiz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:16px}
.quiz-progress{flex:1}
.quiz-progress .row-between{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.quiz-card{max-width:820px;margin:0 auto;padding:34px 38px 28px;position:relative;overflow:hidden}
.q-kind{font-size:10.5px;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:12px}
.q-prompt{font-family:var(--font-serif);font-size:clamp(30px,4.5vw,44px);line-height:1.2;letter-spacing:-.5px;margin:0 0 4px;word-break:break-word}
.q-prompt.cn{font-family:var(--font-ui);font-size:clamp(20px,3vw,28px);line-height:1.5;font-weight:600}
.q-hint{font-size:12px;color:var(--muted);margin-bottom:22px}
.options{display:grid;gap:9px;margin-top:18px}
.option{display:flex;align-items:center;gap:12px;width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:13px;background:var(--surface);text-align:left;font-size:13.5px;transition:.14s var(--ease)}
.option:hover{border-color:var(--line-strong);background:var(--surface-2)}
.option .key{width:24px;height:24px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;font-size:10.5px;color:var(--muted);flex:0 0 auto;font-family:var(--font-ui)}
.option .txt{flex:1;line-height:1.45}
.option.correct{border-color:var(--green);background:var(--green-soft)}
.option.correct .key{background:var(--green);color:#fff}
.option.wrong{border-color:var(--red);background:var(--red-soft)}
.option.wrong .key{background:var(--red);color:#fff}
.option.dim{opacity:.55}
.option:disabled{cursor:default;transform:none}
.feedback{margin-top:18px;padding:14px 16px;border-radius:13px;font-size:12.5px;line-height:1.6;animation:revealIn .25s var(--ease)}
.feedback.ok{background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 25%,transparent);color:var(--green)}
.feedback.no{background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 25%,transparent);color:var(--red)}
.feedback b{color:inherit}
.feedback .ans-en{font-family:var(--font-serif);font-size:16px;display:block;margin:3px 0}
.spell-input{width:100%;padding:15px 16px;border:1.5px solid var(--line-strong);border-radius:13px;background:var(--surface);font-family:var(--font-serif);font-size:24px;letter-spacing:.5px;outline:none}
.spell-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.quiz-actions{display:flex;justify-content:flex-end;margin-top:18px;gap:8px}
.result-card{max-width:760px;margin:0 auto;padding:36px;text-align:center}
.score-ring{width:142px;height:142px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:conic-gradient(var(--primary) calc(var(--score,0)*1%),var(--surface-3) 0);position:relative}
.score-ring::before{content:"";position:absolute;inset:11px;border-radius:50%;background:var(--surface)}
.score-ring div{position:relative;text-align:center}
.score-ring b{font-family:var(--font-serif);font-size:40px;line-height:1}
.score-ring span{font-size:10.5px;color:var(--muted);display:block;margin-top:3px}
.result-title{font-family:var(--font-serif);font-size:26px;margin:0 0 5px}
.result-sub{color:var(--muted);font-size:13px;margin:0}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}
.result-mini{padding:13px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line)}
.result-mini b{display:block;font-family:var(--font-serif);font-size:22px}
.result-mini span{font-size:10.5px;color:var(--muted)}

/* ---------- translate ---------- */
.translate-wrap{max-width:1040px;margin:0 auto}
.translate-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:18px;align-items:start}
.sentence-card{padding:28px 30px}
.sentence-label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.sentence-zh{font-family:var(--font-serif);font-size:21px;line-height:1.9;margin:0;letter-spacing:.2px}
.sentence-zh .mark{color:var(--primary);font-weight:700;background:linear-gradient(transparent 65%,var(--primary-soft) 0);padding:0 2px}
.sentence-input{width:100%;min-height:150px;margin-top:18px;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);resize:vertical;outline:none;font-family:Georgia,var(--font-ui);font-size:14.5px;line-height:1.8}
.sentence-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);background:var(--surface)}
.ref-box{margin-top:16px;padding:17px;border-radius:14px;background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 20%,transparent);animation:revealIn .3s var(--ease)}
.ref-box h4{font-size:11px;letter-spacing:1px;color:var(--green);margin:0 0 8px;text-transform:uppercase}
.ref-en{font-family:Georgia,var(--font-ui);font-size:14.5px;line-height:1.9;color:var(--ink)}
.key-hits{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.key-hit{font-size:10.5px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.55);color:var(--green)}
[data-theme="dark"] .key-hit{background:rgba(0,0,0,.16)}
.key-hit.miss{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.rate-inline{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}
.term-card{padding:32px;text-align:center;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.term-zh{font-family:var(--font-serif);font-size:32px;font-weight:700;line-height:1.4}
.term-cat{font-size:10.5px;letter-spacing:1.2px;color:var(--muted);margin-top:8px;text-transform:uppercase}
.term-en{font-family:Georgia,serif;font-size:25px;color:var(--primary);margin-top:18px;line-height:1.4;animation:revealIn .25s var(--ease)}
.side-list{display:flex;flex-direction:column;gap:8px}
.side-list-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12px}
.side-list-item:last-child{border-bottom:0}
.side-list-item .n{width:19px;height:19px;border-radius:6px;background:var(--surface-3);display:grid;place-items:center;font-size:9.5px;color:var(--muted);flex:0 0 auto;margin-top:1px}
.quote-card{padding:20px;background:var(--ink);color:#f7f2e8;border-radius:18px;position:relative;overflow:hidden}
.quote-card::after{content:"”";position:absolute;right:12px;bottom:-38px;font-family:Georgia,serif;font-size:130px;opacity:.1}
.quote-card p{font-family:var(--font-serif);font-size:15px;line-height:1.7;margin:0;position:relative;z-index:1}
.quote-card span{font-size:10.5px;opacity:.55;display:block;margin-top:8px}

/* ---------- notebook ---------- */
.analysis-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.analysis-tile{padding:17px;display:flex;flex-direction:column;gap:4px}
.analysis-tile b{font-family:var(--font-serif);font-size:28px;line-height:1.1}
.analysis-tile span{font-size:11px;color:var(--muted)}
.analysis-tile .tag{align-self:flex-start;margin-top:3px}
.analysis-main{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,.65fr);gap:18px;align-items:start}
.tag-bars{display:flex;flex-direction:column;gap:12px}
.tag-bar-head{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.tag-bar-head span{color:var(--muted)}
.tag-bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.tag-bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.wrong-list{display:flex;flex-direction:column;gap:8px}
.wrong-item{padding:14px 15px;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:.16s}
.wrong-item:hover{border-color:var(--line-strong)}
.wrong-item.mastered{opacity:.62}
.wrong-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wrong-prompt{font-family:var(--font-serif);font-size:18px;font-weight:650;line-height:1.3;word-break:break-word}
.wrong-prompt.cn{font-family:var(--font-ui);font-size:14.5px}
.wrong-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.wrong-detail{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);font-size:12px;line-height:1.7}
.wrong-item.open .wrong-detail{display:block;animation:revealIn .2s var(--ease)}
.wrong-answer{display:grid;gap:4px}
.wrong-answer b{color:var(--green)}
.wrong-answer s{color:var(--muted);text-decoration-color:var(--red)}
.wrong-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:15px}
.insight{padding:14px 16px;border-radius:13px;background:var(--gold-soft);border:1px solid color-mix(in srgb,var(--gold) 25%,transparent);font-size:12px;line-height:1.65;color:var(--ink-2)}
.insight b{color:var(--gold)}

/* ---------- stats ---------- */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{padding:18px}
.stat-card .metric b{font-size:30px}
.chart-card{padding:22px}
.big-chart{display:flex;align-items:flex-end;gap:7px;height:190px;padding-top:20px}
.big-chart .act-bar{max-width:none}
.heatmap{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:14px}
.heat-cell{aspect-ratio:1;border-radius:5px;background:var(--surface-3);position:relative}
.heat-cell.l1{background:color-mix(in srgb,var(--primary) 25%,var(--surface-3))}
.heat-cell.l2{background:color-mix(in srgb,var(--primary) 48%,var(--surface-3))}
.heat-cell.l3{background:color-mix(in srgb,var(--primary) 72%,var(--surface-3))}
.heat-cell.l4{background:var(--primary)}
.heat-legend{display:flex;align-items:center;justify-content:flex-end;gap:4px;font-size:10px;color:var(--muted);margin-top:7px}
.heat-legend i{width:10px;height:10px;border-radius:3px;background:var(--surface-3);display:inline-block}
.heat-legend i.l4{background:var(--primary)}
.progress-list{display:flex;flex-direction:column;gap:12px}
.progress-row{display:grid;grid-template-columns:1fr auto;gap:8px;font-size:12px}
.progress-row span{color:var(--muted)}
.progress-row b{font-family:var(--font-serif);font-size:14px}
.achievement-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}
.ach{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);display:flex;align-items:center;gap:9px}
.ach .ach-ico{width:32px;height:32px;border-radius:10px;background:var(--surface-3);color:var(--muted);display:grid;place-items:center}
.ach.on .ach-ico{background:var(--gold-soft);color:var(--gold)}
.ach b{display:block;font-size:11.5px}
.ach span{display:block;font-size:9.5px;color:var(--muted)}

/* ---------- settings ---------- */
.settings-wrap{max-width:840px}
.setting-card{padding:22px;margin-bottom:14px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:13px 0;border-bottom:1px dashed var(--line)}
.setting-row:last-child{border-bottom:0}
.setting-info b{display:block;font-size:13.5px}
.setting-info span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.number-control{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.number-control button{width:31px;height:31px;border-radius:9px;background:var(--surface-3);color:var(--ink-2);display:grid;place-items:center;font-size:16px}
.number-control button:hover{background:var(--primary-soft);color:var(--primary-ink)}
.number-control input{width:58px;text-align:center;border:1px solid var(--line);border-radius:9px;padding:5px 4px;background:var(--surface);font-size:13px;outline:none}
.switch{width:44px;height:25px;border-radius:99px;background:var(--surface-3);position:relative;transition:.2s;flex:0 0 auto;border:1px solid var(--line)}
.switch::after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;left:2px;top:2px;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{left:21px;background:#fff}
[data-theme="dark"] .switch.on::after{background:#082f2b}
.data-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.danger-zone{border-color:color-mix(in srgb,var(--red) 30%,var(--line))}

/* ---------- translate tabs ---------- */
.translate-tabs{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.translate-tabs .seg{flex-wrap:wrap}
.translate-tabs .seg button{white-space:nowrap}

/* ---------- import / decks ---------- */
.import-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr);gap:18px;align-items:start}
.dropzone{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:34px 22px;border-radius:18px;border:1.5px dashed var(--line-strong);
  background:var(--surface-2);text-align:center;cursor:pointer;transition:.18s var(--ease);
}
.dropzone:hover{border-color:var(--primary);background:var(--primary-soft)}
.dropzone.over{border-color:var(--primary);background:var(--primary-soft);transform:translateY(-1px)}
.dropzone .dz-icon{
  width:54px;height:54px;border-radius:16px;display:grid;place-items:center;
  background:var(--surface);border:1px solid var(--line);color:var(--primary);margin-bottom:4px;
}
.dropzone .dz-icon .icon{width:24px;height:24px}
.dropzone b{font-size:15px}
.dropzone span{font-size:12px;color:var(--muted);max-width:420px;line-height:1.7}
.dropzone .dz-file{margin-top:6px;font-size:12px;color:var(--primary);font-weight:600;word-break:break-all}
.paste-box{margin-top:14px}
.paste-box textarea{
  width:100%;min-height:132px;resize:vertical;padding:13px 15px;border-radius:14px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-family:var(--font-ui);font-size:13px;line-height:1.8;
}
.paste-box textarea:focus{outline:none;border-color:var(--primary)}
.format-help{margin-top:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);padding:14px 16px}
.format-help h4{margin:0 0 8px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.format-help ul{margin:0;padding-left:18px;font-size:12.5px;line-height:1.9;color:var(--ink-2)}
.format-help code{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;
  background:var(--surface-3);border-radius:5px;padding:1px 5px;color:var(--ink);
}
.preview-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.preview-num{font-family:var(--font-serif);font-size:30px;line-height:1;color:var(--primary);font-weight:600}
.preview-table{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:14px}
.preview-row{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.4fr);gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.preview-row:last-child{border-bottom:0}
.preview-row.head{background:var(--surface-3);font-size:11px;letter-spacing:.5px;color:var(--muted);position:sticky;top:0;text-transform:uppercase}
.preview-row b{font-weight:600;overflow-wrap:anywhere}
.preview-row span{color:var(--muted);overflow-wrap:anywhere}
.import-note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--gold-soft);color:var(--ink-2);font-size:12.5px;line-height:1.7;margin-top:12px}
.import-note.bad{background:var(--red-soft);color:var(--red)}
.import-note .icon{flex:0 0 auto;margin-top:2px;color:var(--gold)}
.import-note.bad .icon{color:var(--red)}
.batch-list{display:flex;flex-direction:column;gap:8px}
.batch-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.batch-item .bi-main{min-width:0}
.batch-item b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.batch-item span{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.deck-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.deck-stat{padding:11px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);text-align:center}
.deck-stat b{display:block;font-family:var(--font-serif);font-size:20px}
.deck-stat span{font-size:10.5px;color:var(--muted)}

/* ---------- exam (CET4 真题) ---------- */
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.exam-card{
  text-align:left;padding:16px 17px;border-radius:16px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;transition:.18s var(--ease);display:flex;flex-direction:column;gap:7px;
}
.exam-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.exam-card.active{border-color:var(--primary);background:var(--primary-soft)}
.exam-card .ec-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.exam-card h4{margin:0;font-size:16px;font-family:var(--font-serif);letter-spacing:.3px}
.exam-card p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.exam-card .ec-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;font-size:11px;color:var(--muted)}
.exam-card .ec-foot .icon{width:14px;height:14px}
.exam-card.done{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 25%,var(--line))}
.exam-paper{padding:26px 30px}
.exam-paper .paper-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.exam-zh{font-family:var(--font-serif);font-size:17.5px;line-height:2.05;margin:0;letter-spacing:.2px;text-align:justify}
.exam-en{font-family:Georgia,"Times New Roman",serif;font-size:14.5px;line-height:2;margin:0;color:var(--ink);text-align:justify}
.exam-en-wrap{margin-top:16px;padding:18px 20px;border-radius:16px;background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 18%,transparent);animation:revealIn .3s var(--ease)}
.exam-en-wrap h4{margin:0 0 10px;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--green)}
.exam-terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.exam-note{margin-top:14px;padding:13px 15px;border-radius:12px;background:var(--gold-soft);font-size:12.5px;line-height:1.8;color:var(--ink-2)}
.exam-note b{color:var(--gold)}
.exam-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.exam-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;margin-top:16px}
.exam-split h5{margin:0 0 8px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.exam-mine{font-size:13.5px;line-height:1.9;white-space:pre-wrap;word-break:break-word;color:var(--ink-2);margin:0}
.exam-empty{font-size:12.5px;color:var(--muted);font-style:italic}
.exam-progress{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted)}
.exam-list-mini{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.exam-mini{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;border:1px solid transparent;background:var(--surface-2);font-size:11.5px;cursor:pointer;text-align:left}
.exam-mini:hover{border-color:var(--line-strong)}
.exam-mini.now{background:var(--primary-soft);color:var(--primary-ink)}
.exam-mini i{font-style:normal;width:15px;flex:0 0 auto;text-align:center;color:var(--muted)}
.exam-mini.ok i{color:var(--green)}

@media (max-width:1080px){
  .import-grid{grid-template-columns:minmax(0,1fr)}
  .exam-split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .exam-paper{padding:20px 18px}
  .exam-zh{font-size:16px;line-height:1.95}
  .preview-row{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}
}

/* ---------- modal/toast ---------- */
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);z-index:100;
  background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:12px;font-size:12.5px;
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s var(--ease);max-width:min(90vw,520px);text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.modal-mask{position:fixed;inset:0;z-index:90;background:rgba(14,22,26,.45);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px;animation:fadeIn .2s}
.modal{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:24px;animation:modalIn .22s var(--ease)}
.modal h3{font-family:var(--font-serif);font-size:22px;margin:0 0 6px}
.modal p{font-size:12.5px;color:var(--muted);line-height:1.7;margin:0 0 18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .home-grid{grid-template-columns:1fr}
  .streak-card{min-height:auto}
  .home-lower{grid-template-columns:1fr}
  .analysis-main,.translate-grid{grid-template-columns:1fr}
  .analysis-grid{grid-template-columns:repeat(2,1fr)}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .scope-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:980px){
  .sidebar{display:none}
  .mobile-header{display:flex}
  .bottom-nav{display:grid}
  .main{margin-left:0;padding:78px 20px 94px}
  .page-title{font-size:26px}
  .topbar{margin-bottom:18px}
  .top-actions .pill-btn span{display:none}
  .top-actions .pill-btn{padding:9px}
}
@media (max-width:700px){
  body{font-size:14px}
  .main{padding:74px 14px 92px}
  .topbar{gap:10px}
  .page-title{font-size:23px}
  .page-desc{font-size:12px}
  .card-pad{padding:17px}
  .hero{padding:23px 20px;border-radius:22px;min-height:0}
  .hero h1{font-size:28px}
  .hero-bottom{align-items:flex-end;gap:12px}
  .ring{width:84px;height:84px}
  .ring-inner b{font-size:19px}
  .task-grid{grid-template-columns:1fr;gap:10px}
  .task-card{flex-direction:row;align-items:center;gap:13px;padding:14px}
  .task-card .task-ico{flex:0 0 auto}
  .task-card>div:not(.task-ico){min-width:0;flex:1}
  .task-card .go{margin:0}
  .home-lower{gap:12px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .flashcard{padding:28px 17px 22px;min-height:360px;border-radius:18px}
  .fc-word{font-size:47px}
  .fc-phonetic{font-size:14px}
  .rate-bar{gap:7px}
  .rate-btn{padding:12px 5px}
  .rate-btn b{font-size:12px}
  .rate-btn span{font-size:9px}
  .study-top{flex-direction:column;align-items:stretch;gap:9px}
  .study-progress{max-width:none}
  .quiz-card{padding:24px 17px 20px;border-radius:18px}
  .q-prompt{font-size:28px}
  .q-prompt.cn{font-size:20px}
  .option{padding:12px;font-size:13px}
  .quiz-config{grid-template-columns:1fr}
  .result-grid{grid-template-columns:1fr}
  .sentence-card{padding:20px 17px}
  .sentence-zh{font-size:18px}
  .analysis-grid{grid-template-columns:1fr 1fr}
  .analysis-tile b{font-size:23px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .finish-card{padding:34px 19px}
  .finish-stats{gap:24px}
  .scope-grid{grid-template-columns:1fr 1fr}
  .heatmap{grid-template-columns:repeat(10,1fr)}
  .setting-row{gap:12px}
  .share-line{display:none}
  .wrong-top{flex-direction:column;gap:8px}
  .wrong-top .tag{align-self:flex-start}
}
@media (max-width:400px){
  .bottom-nav{grid-template-columns:repeat(6,1fr);padding-left:2px;padding-right:2px}
  .bnav{font-size:9px}
  .bnav .icon{width:19px;height:19px}
  .fc-word{font-size:40px}
  .hero h1{font-size:25px}
  .rate-bar{grid-template-columns:1fr 1fr 1.15fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
