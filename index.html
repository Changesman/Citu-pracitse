["classical garden","environmental art","organically combine","artificial landscape","natural landform"]},{"topic":"文房四宝","zh":"文房四宝指的是笔、墨、纸、砚，是中国古代文人书房中必备的宝贝。","en":"The Four Treasures of the Study refer to the writing brush, inkstick, paper and inkstone, which were essential treasures in the studies of ancient Chinese scholars.","terms":["the Four Treasures of the Study","writing brush","inkstick","inkstone","scholar"]},{"topic":"对联","zh":"对联字数相等、词性相同、平仄相合、内容相关，是中国特有的文学形式。","en":"An antithetical couplet has equal numbers of characters, the same parts of speech, matching tonal patterns and related content; it is a literary form unique to China.","terms":["antithetical couplet","parts of speech","tonal pattern","literary form","unique to China"]},{"topic":"围棋","zh":"围棋规则简单而玄妙，体现了中国文化中的智慧与灵性。","en":"The rules of Weiqi are simple yet profound, reflecting the wisdom and spirit of Chinese culture.","terms":["Weiqi","simple yet profound","reflect","wisdom","spirit"]},{"topic":"京剧","zh":"京剧被誉为“东方歌剧”，集唱、念、做、打于一体。","en":"Praised as \"Oriental Opera,\" Beijing Opera integrates singing, recitation, acting and acrobatic fighting.","terms":["Oriental Opera","Beijing Opera","integrate","recitation","acrobatic fighting"]},{"topic":"道教","zh":"道教是中国土生土长的宗教，以《道德经》为主要经典。","en":"Taoism is an indigenous religion of China, with Tao Te Ching as its main classic.","terms":["Taoism","indigenous","Tao Te Ching","classic"]},{"topic":"成语","zh":"成语大多由四个汉字组成，是汉语中精炼而富有生命力的一部分。","en":"Most Chinese idioms consist of four characters and are a concise and vital part of the Chinese language.","terms":["Chinese idioms","consist of","four characters","concise","vital"]},{"topic":"书法","zh":"中国书法不仅是汉字的书写形式，也是体现自我修养的艺术。","en":"Chinese calligraphy is not only a form of writing Chinese characters but also an art of self-cultivation.","terms":["calligraphy","form of writing","Chinese characters","self-cultivation"]},{"topic":"山水画","zh":"中国山水画强调人与自然的和谐，往往描绘画家想象中的风景。","en":"Chinese landscape painting emphasizes harmony between man and nature and often depicts landscapes imagined by the painter.","terms":["landscape painting","harmony between man and nature","depict","imagined","painter"]},{"topic":"长城","zh":"长城始建于春秋战国时期，现存遗迹主要是明代修筑的长城。","en":"The Great Wall was first built during the Spring and Autumn and Warring States periods; the existing sections were mainly built in the Ming Dynasty.","terms":["the Great Wall","Spring and Autumn","Warring States","existing sections","Ming Dynasty"]},{"topic":"故宫","zh":"故宫又名紫禁城，是明清两代皇帝居住和处理政务的地方。","en":"The Imperial Palace, also known as the Forbidden City, was where emperors of the Ming and Qing dynasties lived and handled state affairs.","terms":["the Imperial Palace","the Forbidden City","emperor","Ming and Qing dynasties","state affairs"]},{"topic":"春节","zh":"春节是中国最重要的传统节日，家人会一起吃年夜饭、贴春联、放鞭炮。","en":"The Spring Festival is China's most important traditional festival, when families have a reunion dinner, put up spring couplets and set off firecrackers.","terms":["Spring Festival","traditional festival","reunion dinner","spring couplets","firecrackers"]},{"topic":"中秋节","zh":"中秋节在农历八月十五，人们赏月、吃月饼，象征家庭团圆。","en":"The Mid-Autumn Festival falls on the 15th day of the eighth lunar month, when people admire the moon and eat mooncakes, symbolizing family reunion.","terms":["Mid-Autumn Festival","lunar month","admire the moon","mooncake","family reunion"]},{"topic":"端午节","zh":"端午节是为了纪念爱国诗人屈原，主要习俗有吃粽子和赛龙舟。","en":"The Dragon Boat Festival commemorates the patriotic poet Qu Yuan, and its main customs include eating zongzi and racing dragon boats.","terms":["Dragon Boat Festival","commemorate","patriotic poet","Qu Yuan","dragon boat racing"]},{"topic":"元宵节","zh":"元宵节人们吃汤圆、猜灯谜、舞龙舞狮，象征团圆和美满。","en":"During the Lantern Festival, people eat tangyuan, guess lantern riddles and perform dragon and lion dances, symbolizing reunion and happiness.","terms":["Lantern Festival","tangyuan","lantern riddles","dragon and lion dances","reunion"]},{"topic":"茶文化","zh":"茶文化在中国历史悠久，饮茶不仅是一种生活习惯，也是一种精神享受。","en":"Tea culture has a long history in China; drinking tea is not only a way of life but also a spiritual enjoyment.","terms":["tea culture","long history","way of life","spiritual enjoyment"]},{"topic":"饮食","zh":"中国菜讲究色、香、味，形成了各具特色的八大菜系。","en":"Chinese cuisine pays attention to color, aroma and taste, and has formed eight distinctive regional cuisines.","terms":["Chinese cuisine","color, aroma and taste","distinctive","regional cuisines"]},{"topic":"服饰","zh":"中国传统服饰如旗袍和中山装，至今仍受到许多人的喜爱。","en":"Traditional Chinese clothing such as the cheongsam and the Chinese tunic suit is still loved by many people today.","terms":["traditional Chinese clothing","cheongsam","Chinese tunic suit","loved by"]},{"topic":"孔子","zh":"孔子是一位思想家、教育家，他的思想对中国文化产生了深远影响。","en":"Confucius was a thinker and educator whose ideas have had a profound influence on Chinese culture.","terms":["Confucius","thinker","educator","profound influence","Chinese culture"]},{"topic":"诗书画","zh":"中国画、书法和诗歌常常相互交融，共同体现中国人的审美情趣。","en":"Chinese painting, calligraphy and poetry often blend with one another, jointly expressing Chinese aesthetic tastes.","terms":["Chinese painting","calligraphy","poetry","blend with","aesthetic tastes"]},{"topic":"昆曲","zh":"昆曲有六百多年历史，被誉为“百戏之祖”。","en":"Kunqu Opera has a history of more than 600 years and is known as the \"ancestor of Chinese operas.\"","terms":["Kunqu Opera","history","600 years","ancestor of Chinese operas"]},{"topic":"武术","zh":"中国武术强调刚柔并济，既是一种技击术，也是一种修身养性的方式。","en":"Chinese martial arts emphasize the balance of hardness and softness; they are both a fighting skill and a way of self-cultivation.","terms":["Chinese martial arts","balance of hardness and softness","fighting skill","self-cultivation"]},{"topic":"丝绸之路","zh":"丝绸之路连接了中国与中亚、波斯湾和地中海，促进了中外贸易与文化交流。","en":"The Silk Road connected China with Central Asia, the Persian Gulf and the Mediterranean, promoting trade and cultural exchanges between China and foreign countries.","terms":["the Silk Road","Central Asia","Persian Gulf","Mediterranean","trade and cultural exchanges"]}],"confuseGroups":[{"words":["affect","effect"],"tip":"affect 常作动词“影响”；effect 常作名词“效果、影响”，have an effect on 是固定搭配。"},{"words":["adapt","adopt"],"tip":"adapt 是“适应、改编”，常接 to；adopt 是“采用、收养”，后面直接接宾语。"},{"words":["access","assess","excess"],"tip":"access 是“通道、使用权”；assess 是“评估”；excess 是“过量、过度”。"},{"words":["principal","principle"],"tip":"principal 可作“校长、主要的”；principle 只作名词“原则、原理”。"},{"words":["desert","dessert"],"tip":"desert 是“沙漠；抛弃”；dessert 是“甜点”，多一个 s 反而更甜。"},{"words":["personal","personnel"],"tip":"personal 是“个人的”；personnel 是“全体人员、人事部门”。"},{"words":["sensible","sensitive"],"tip":"sensible 是“明智的、有判断力的”；sensitive 是“敏感的、易受影响的”。"},{"words":["assume","consume","resume"],"tip":"assume 是“假定、承担”；consume 是“消耗、消费”；resume 是“恢复、重新开始”。"},{"words":["attribute","contribute","distribute"],"tip":"attribute A to B 把 A 归因于 B；contribute to 促成、贡献；distribute 是“分发、分布”。"},{"words":["expect","respect","aspect","suspect","inspect"],"tip":"expect 期待；respect 尊重；aspect 方面；suspect 怀疑；inspect 检查。"},{"words":["contact","contract","contrast","context"],"tip":"contact 联系；contract 合同、收缩；contrast 对比；context 语境、背景。"},{"words":["expand","expend","extend"],"tip":"expand 扩大、膨胀；expend 花费、消耗；extend 延伸、延长。"},{"words":["altitude","attitude","aptitude"],"tip":"altitude 海拔、高度；attitude 态度；aptitude 天资、倾向。"},{"words":["council","counsel"],"tip":"council 是“委员会、理事会”；counsel 是“建议、劝告”，也可作动词。"},{"words":["conscience","conscious"],"tip":"conscience 是“良心”；conscious 是“有意识的”，be conscious of 意识到。"},{"words":["custom","customer"],"tip":"custom 是“习俗、海关”；customer 是“顾客”。"},{"words":["ensure","insure","assure"],"tip":"ensure 确保某事发生；insure 给……投保；assure 向某人保证，常用 assure sb. of sth.。"},{"words":["expose","impose","oppose","propose"],"tip":"expose 暴露；impose 强加，impose on；oppose 反对；propose 提议、求婚。"},{"words":["vary","variety"],"tip":"vary 是动词“变化”；various 是形容词“各种各样的”；variety 是名词“多样性、种类”。"},{"words":["wander","wonder"],"tip":"wander 是“漫游、走神”；wonder 是“想知道、奇迹”。"},{"words":["worth","worthwhile"],"tip":"be worth doing；be worthy of being done / to be done；it is worthwhile to do / doing。"},{"words":["rise","arise","arouse","raise"],"tip":"rise 不及物“上升”；arise 不及物“出现、产生”；arouse 及物“唤起”；raise 及物“举起、提高”。"},{"words":["capital","captain"],"tip":"capital 首都、资本、大写字母；captain 船长、队长。"},{"words":["confirm","conform"],"tip":"confirm 确认、证实；conform 遵守、符合，常接 to。"},{"words":["contain","maintain","retain","attain"],"tip":"contain 包含；maintain 维持、主张；retain 保留；attain 达到、获得。"},{"words":["critic","critical","criticize","criterion"],"tip":"critic 评论家；critical 批判的、关键的；criticize 批评；criterion 标准（复数 criteria）。"},{"words":["current","currency"],"tip":"current 当前的、水流/电流；currency 货币、流通。"},{"words":["device","devise"],"tip":"device 是名词“装置、设备”；devise 是动词“设计、想出”。"},{"words":["draft","drift"],"tip":"draft 草稿、起草；drift 漂流、逐渐变化。"},{"words":["form","formal","format","formation"],"tip":"form 形式/形成；formal 正式的；format 格式；formation 形成、构造。"},{"words":["grant","grind"],"tip":"grant 授予、拨款；grind 磨碎、碾磨。"},{"words":["imply","implicit","explicit"],"tip":"imply 暗示；implicit 含蓄的、隐含的；explicit 明确的、直截了当的。"},{"words":["infer","refer","prefer"],"tip":"infer 推断；refer to 提到、参考；prefer 更喜欢。"},{"words":["alive","living"],"tip":"live 多作定语或动词；alive 多作表语；living 可作定语“活着的、现存的”。"},{"words":["reserve","deserve","preserve","conservative"],"tip":"reserve 预订、保留；deserve 值得；preserve 保护、保存；conservative 保守的。"},{"words":["respond","correspond"],"tip":"respond 回应；correspond 通信、相符，correspond with/to。"},{"words":["source","resource"],"tip":"source 来源、源头；resource 资源，常复数为 resources。"},{"words":["statue","status"],"tip":"statue 雕像；status 地位、状态。"},{"words":["strip","stripe","strive"],"tip":"strip 剥去、条带；stripe 条纹；strive 努力、奋斗。"},{"words":["tense","intense","intensive"],"tip":"tense 紧张的、时态；intense 强烈的；intensive 密集的、加强的。"},{"words":["emit","omit","submit","admit","commit"],"tip":"emit 发出；omit 省略；submit 提交、屈服；admit 承认、准许进入；commit 犯（错）、承诺。"},{"words":["acquire","inquire","require"],"tip":"acquire 获得；inquire 询问；require 需要、要求。"},{"words":["compose","impose","propose","oppose"],"tip":"compose 组成、创作；impose 强加；propose 提议；oppose 反对。"},{"words":["reject","project","subject","object"],"tip":"reject 拒绝；project 项目、投射；subject 主题、使遭受；object 物体、反对。"},{"words":["describe","prescribe","script"],"tip":"describe 描述；prescribe 开处方、规定；script 剧本、文字。"},{"words":["compete","complete"],"tip":"compete 竞争；complete 完成、完整的。"},{"words":["adapt","adopt"],"tip":"adapt 适应；adopt 采用；adept 熟练的（本词库未收，见到也要会区分）。"}],"phraseGroups":[{"words":["in time","on time"],"tip":"in time 是“及时”，on time 是“准时”。"},{"words":["at times","at a time"],"tip":"at times 有时；at a time 一次、每次。"},{"words":["apart from","except for"],"tip":"apart from 可表示“除……外还有/没有”；except for 通常表示“除……之外（例外）”。"},{"words":["look after","look for","look into","look down on"],"tip":"look after 照顾；look for 寻找；look into 调查；look up to 尊敬；look down on 看不起。"},{"words":["take off","take on","take over","take up"],"tip":"take off 起飞/脱下；take on 承担/呈现；take over 接管；take up 占据/开始从事；take in 吸收/理解。"},{"words":["put off","put out","put up","put up with","put on"],"tip":"put off 推迟；put out 熄灭；put up 搭建/张贴；put up with 容忍；put on 穿上/上演。"},{"words":["turn on","turn off","turn down","turn out"],"tip":"turn on 打开；turn off 关闭；turn up 出现/调高；turn down 拒绝/调低；turn out 结果是。"},{"words":["break down","break up","break in"],"tip":"break down 出故障/崩溃；break out 爆发；break up 分手/解散；break in 强行进入/打断。"},{"words":["bring up","bring about","bring out","bring back"],"tip":"bring up 抚养/提出；bring about 导致；bring out 使显现/出版；bring back 带回/使想起。"},{"words":["come up with","come true","come about"],"tip":"come across 偶然遇到；come up with 想出；come true 实现；come about 发生。"},{"words":["carry out","carry on"],"tip":"carry out 执行、实施；carry on 继续。"},{"words":["get along with","get rid of","get through","get over"],"tip":"get along with 与……相处；get rid of 摆脱；get through 接通/完成；get over 克服/恢复。"},{"words":["go over","go through","go without"],"tip":"go over 复习/检查；go through 经历/仔细检查；go without 没有……也凑合。"},{"words":["set off","set up","set out","set about"],"tip":"set off 出发/引爆；set up 建立；set out 出发/着手；set about 开始做。"},{"words":["show off","show up"],"tip":"show off 炫耀；show up 出现、露面。"},{"words":["stand for","stand out","stand by"],"tip":"stand for 代表；stand out 突出；stand by 支持/袖手旁观。"},{"words":["make up","make up for","make out","make sense"],"tip":"make up 编造/化妆/组成；make up for 弥补；make out 辨认出；make sense 有道理。"},{"words":["account for","allow for","answer for"],"tip":"account for 解释/占比例；allow for 考虑到；answer for 对……负责。"},{"words":["agree on","agree with","agree to"],"tip":"agree on 就……达成一致；agree with 同意某人/与……相符；agree to 同意计划、建议。"},{"words":["apply for","apply to"],"tip":"apply for 申请；apply to 适用于/向……申请。"},{"words":["at last","at least","at present","at once"],"tip":"at last 最后；at least 至少；at present 目前；at once 立刻/同时。"},{"words":["by accident","by chance","on purpose"],"tip":"by accident 和 by chance 都是“偶然地”；on purpose 是“故意地”。"},{"words":["in place","in place of","instead of"],"tip":"in place 在适当位置；in place of 代替；instead of 代替、而不是。"},{"words":["in case","in case of","in any case"],"tip":"in case 万一/以防；in case of 如果发生；in any case 无论如何。"},{"words":["on the contrary","on the other hand","on the whole"],"tip":"on the contrary 正相反；on the other hand 另一方面；on the whole 总体上。"},{"words":["as a result","as a result of","result in","result from"],"tip":"as a result 因此；as a result of 由于；result in 导致；result from 由……造成。"},{"words":["die from","die out"],"tip":"die of 死于（疾病、饥饿等内因）；die from 死于（事故等外因）；die out 灭绝。"},{"words":["run out","run out of","run into"],"tip":"run out 用完（不及物）；run out of 用完某物；run into 偶遇/撞上；run over 碾过。"},{"words":["look forward to","look up"],"tip":"look forward to 期待；look back on 回顾；look up 查阅/抬头看。"},{"words":["pay attention to","pay for","pay off"],"tip":"pay attention to 注意；pay for 为……付款；pay off 还清/得到回报。"},{"words":["keep up with","keep in touch with"],"tip":"keep up with 跟上；keep in touch with 与……保持联系；keep away from 远离。"},{"words":["be familiar with","be familiar to"],"tip":"sb. be familiar with sth. 某人熟悉某物；sth. be familiar to sb. 某物为某人所熟悉。"},{"words":["rely on","count on"],"tip":"depend on 取决于/依靠；rely on 依赖；count on 指望。"},{"words":["consist of","consist in"],"tip":"consist of 由……组成；consist in 在于。"}],"exams":[{"year":"2024年6月","set":"第一套","topic":"农历","kind":"真题","zh":"农历(the lunar calendar)起源于数千年前的中国，根据太阳和月亮的运行规律制定。长期以来，农历在农业生产和人们日常生活中发挥着重要作用。古人依据农历记录日期、安排农活，以便最有效地利用自然资源和气候条件，提高农作物的产量和质量。中国的春节、中秋节等传统节日的日期都基于农历。农历是中国传统文化的重要组成部分，当今依然广为使用。","en":"The lunar calendar originated in China thousands of years ago and was worked out according to the movements of the sun and the moon. For a long time, it has played an important role in agricultural production and in people's daily life. The ancients recorded dates and arranged farm work by the lunar calendar so as to make the best use of natural resources and climate conditions and to raise the yield and quality of crops. The dates of traditional Chinese festivals such as the Spring Festival and the Mid-Autumn Festival are all based on the lunar calendar. The lunar calendar is an important part of traditional Chinese culture and is still widely used today.","terms":["the lunar calendar","agricultural production","make the best use of","yield and quality","be based on"],"note":"无主语句可转被动或补形式主语；“依据农历安排农活”用 by the lunar calendar 作方式状语；“依然广为使用”注意被动语态。"},{"year":"2024年6月","set":"第二套","topic":"四合院","kind":"真题","zh":"四合院(siheyuan)是中国一种传统的住宅建筑，其特点是房屋建造在一个院子的四周，将院子合围在中间。四合院通常冬暖夏凉，环境舒适，尤其适合大家庭居住。四合院在中国各地有多种类型，其中以北京的四合院最为典型。如今，随着现代城市的发展，传统的四合院已逐渐减少，但因其独特的建筑风格，四合院对中国文化的传承和中国历史的研究具有重要意义。","en":"Siheyuan is a traditional type of residential building in China. It is characterized by houses built on all four sides of a courtyard, which is thus enclosed in the middle. Siheyuan is usually warm in winter and cool in summer, offering a comfortable living environment, and is especially suitable for large families. There are various types of siheyuan across China, among which those in Beijing are the most typical. Today, with the development of modern cities, traditional siheyuan has gradually decreased in number; however, thanks to its unique architectural style, it is of great significance to the inheritance of Chinese culture and the study of Chinese history.","terms":["residential building","be characterized by","be suitable for","the most typical","architectural style","the inheritance of Chinese culture"],"note":"“其特点是……”用 be characterized by；“冬暖夏凉”并列形容词即可；“因其……”用 thanks to / because of 引出原因状语。"},{"year":"2024年6月","set":"第三套","topic":"福字","kind":"真题","zh":"汉语中的“福”表示幸福和好运，是中国传统文化中最常用的吉祥符号之一。人们通常将一个大大的“福”字写在红纸上，寓意期盼家庭幸福、社会安定、国家昌盛。春节贴“福”字是民间由来已久的习俗。为了欢庆春节，家家户户都会将“福”字贴在门上或墙上，表达对幸福生活的期待。人们有时还将“福”字倒过来贴，表示“幸福已到”。","en":"In Chinese, fu means happiness and good luck, and it is one of the most commonly used auspicious symbols in traditional Chinese culture. People usually write a large fu on red paper, which expresses the hope for family happiness, social stability and national prosperity. Pasting fu during the Spring Festival is a long-established folk custom. To celebrate the Spring Festival, every household pastes fu on doors or walls to show their expectation of a happy life. Sometimes people paste it upside down, which means that happiness has arrived.","terms":["auspicious symbols","social stability","national prosperity","a long-established folk custom","every household","upside down"],"note":"“寓意……”可用 which expresses / symbolizing；“由来已久”long-established；“倒过来贴”upside down 是高频表达。"},{"year":"2023年12月","set":"第一套","topic":"饮食的变化","kind":"真题","zh":"改革开放以来，中国人的饮食发生了显著的变化。过去由于经济落后，食品种类有限、数量不足，人们仅仅满足于吃得饱。如今中国经济快速发展，食品不仅更加丰富多样，质量也大幅提高。随着生活水平不断提升，人们对饮食的要求越来越高，更加注重吃得营养。因此，目前市场上推出的低脂、低糖、有机食品受到人们的普遍欢迎。","en":"Since the reform and opening-up, the Chinese diet has undergone significant changes. In the past, because the economy was backward and food was limited in both variety and quantity, people were only satisfied with eating their fill. Today, with China's rapid economic development, food is not only more varied but also much better in quality. As living standards keep rising, people have higher demands for food and pay more attention to eating nutritiously. As a result, the low-fat, low-sugar and organic foods now available on the market are widely welcomed.","terms":["the reform and opening-up","undergo significant changes","eating their fill","living standards","pay attention to","organic foods"],"note":"“改革开放以来”Since the reform and opening-up；“吃得饱”可意译为 eat one's fill；“受到普遍欢迎”be widely welcomed。"},{"year":"2023年12月","set":"第二套","topic":"健康饮食","kind":"真题","zh":"中国政府十分重视人民的健康饮食。通过大力提倡健康饮食，人们对合理营养增进健康的重要性有了更加深刻的认识。“吃得安全、吃得营养、吃得健康”是人民对美好生活的基本需求，是提升人民幸福感的必然要求，也为食品产业的发展提供了新机遇。目前，各级政府都在采取多种措施，推进健康中国的建设。","en":"The Chinese government attaches great importance to a healthy diet for its people. By vigorously advocating healthy eating, the Chinese people have gained a deeper understanding of the importance of proper nutrition to better health. \"Eating safely, nutritiously and healthily\" is the people's basic demand for a better life and an inevitable requirement for enhancing their sense of well-being; it also creates new opportunities for the development of the food industry. At present, governments at all levels are taking various measures to advance the building of a Healthy China.","terms":["attach great importance to","vigorously advocate","a deeper understanding of","a sense of well-being","governments at all levels","take various measures"],"note":"“十分重视”attach great importance to；“必然要求”an inevitable requirement；“健康中国”是专名，译作 a Healthy China。"},{"year":"2023年12月","set":"第三套","topic":"饮食与生活水平","kind":"真题","zh":"改革开放以来，中国人民生活水平不断提高，这在人们的饮食(diet)变化上得到充分体现。如今，人们不再满足于吃得饱，而是追求吃得更加安全、更加营养、更加健康，食物也愈来愈丰富多样，不再限于本地的农产品。物流业(logistics industry)的发展使人们很容易品尝到全国各地的特产。毫无疑问，食品质量与饮食结构的改善为增进人们健康提供了有力的保障。","en":"Since the reform and opening-up, the living standard of the Chinese people has been rising continuously, which is fully reflected in the changes in their diet. Today, people are no longer satisfied with eating enough; instead, they seek to eat more safely, more nutritiously and more healthily. Food has also become more and more varied and is no longer limited to local farm produce. The development of the logistics industry makes it easy for people to taste specialties from all over the country. There is no doubt that the improvement of food quality and diet structure provides a strong guarantee for better health.","terms":["be fully reflected in","no longer satisfied with","local farm produce","the logistics industry","specialties from all over the country","a strong guarantee"],"note":"“不再满足于……而是……”用 no longer ... instead ...；“毫无疑问”There is no doubt that 是万能句式。"},{"year":"2022年12月","set":"第一套","topic":"立春","kind":"真题","zh":"立春(Start of Spring)在中国农历中表示春天的开始。立春之后，白天变得更长，天气也愈发温暖，万物开始复苏，大地充满生机。人们常说“一年之计在于春”，农民在这个时节开始播种，为全年的丰收打下基础。中国人早在三千年前就已开始在立春这一天举行庆祝活动。数百年来，迎春一直是民间的重要习俗。在春暖花开的日子里，人们常常外出游玩，欣赏春天的美景。","en":"Start of Spring marks the beginning of spring in the Chinese lunar calendar. After that, the days grow longer and the weather gets warmer; everything begins to revive and the earth is full of life. As the saying goes, \"A year's plan starts in spring.\" Farmers begin sowing at this time of year, laying the foundation for a good harvest. As early as 3,000 years ago, the Chinese began to hold celebrations on the day of Start of Spring. For hundreds of years, welcoming spring has been an important folk custom. On warm spring days when flowers are in bloom, people often go out to enjoy the beautiful scenery.","terms":["mark the beginning of","everything begins to revive","As the saying goes","lay the foundation for","folk custom","in bloom"],"note":"节气名首字母大写；“一年之计在于春”可直译加引号；“打下基础”lay the foundation for。"},{"year":"2022年12月","set":"第二套","topic":"冬至","kind":"真题","zh":"冬至是全年白昼最短、黑夜最长的一天，标志着一年中最寒冷时节的开始。冬至过后，气温越来越低，人们的户外活动逐渐减少。农民地里的活不多，主要忙于灌溉系统的维护和主要农作物的防冻，同时为来年春天播种做准备。中国人历来很重视冬至，许多地方都把冬至当作一个节日，庆祝方式不尽相同。北方人有冬至吃饺子的习俗，南方人有冬至吃汤圆的传统。","en":"The winter solstice is the day with the shortest daytime and the longest night of the year, marking the beginning of the coldest season. After the winter solstice, the temperature drops steadily and people's outdoor activities gradually decrease. Farmers have little work in the fields; they are mainly busy maintaining irrigation systems and protecting major crops from freezing, while preparing for spring sowing the next year. The Chinese have always attached great importance to the winter solstice, and many places treat it as a festival celebrated in different ways. People in the north have the custom of eating dumplings, while people in the south have the tradition of eating sweet dumplings.","terms":["the winter solstice","marking the beginning of","outdoor activities","irrigation systems","protect crops from freezing","sweet dumplings"],"note":"注意“白昼最短、黑夜最长”的比较级搭配；“忙于做某事”be busy doing；“庆祝方式不尽相同”用过去分词短语收尾最简。"},{"year":"2022年12月","set":"第三套","topic":"立秋","kind":"真题","zh":"在中国农历中，立秋(Start of Autumn)意味着夏天的结束和秋天的开始。立秋带来的首先是天气的变化，气温逐渐下降。人们看到树叶开始变黄飘落时，就知道秋天已经来临，这就是所谓的“一叶知秋”。但此时酷热的天气并未完全结束，高温通常还会持续一段时间，被称为“秋老虎”。立秋对农民意义重大，这时各种秋季作物迅速生长、开始成熟，收获的季节即将到来。","en":"In the Chinese lunar calendar, Start of Autumn means the end of summer and the beginning of autumn. The first change it brings is in the weather, as the temperature gradually falls. When people see leaves turning yellow and falling, they know that autumn has arrived — this is what is meant by \"one falling leaf heralds autumn\". However, the heat does not end completely at this point; high temperatures usually last for a while, which is known as \"autumn tiger\". Start of Autumn means a great deal to farmers: autumn crops grow rapidly and begin to ripen, and the harvest season is approaching.","terms":["mean the end of","gradually fall","one falling leaf heralds autumn","high temperatures","ripen","the harvest season is approaching"],"note":"“一叶知秋”有固定译法；解释性内容可用破折号或定语从句承接；“即将到来”is approaching。"},{"year":"2019年6月","set":"第一套","topic":"剪纸","kind":"真题","zh":"剪纸是中国民间艺术的一种独特形式，已有2000多年历史。剪纸很可能源于汉代，继纸张发明之后。从此，它在中国的许多地方得到了普及。剪纸用的材料和工具很简单：纸和剪刀。剪纸作品通常是用红纸做成的，因为红色在中国传统文化中与幸福相联。因此，在婚礼、春节等喜庆场合，红色的剪纸是门窗装饰的首选。","en":"Paper cutting is a unique form of Chinese folk art with a history of more than 2,000 years. It most probably originated in the Han Dynasty, following the invention of paper. Since then it has gained popularity in many parts of China. The materials and tools used for paper cutting are simple: paper and scissors. Paper-cutting works are usually made of red paper, because red is associated with happiness in traditional Chinese culture. Therefore, red paper cuttings are the first choice for decorating doors and windows on festive occasions such as weddings and the Spring Festival.","terms":["a unique form of Chinese folk art","originate in","gain popularity","be associated with","the first choice for","festive occasions"],"note":"“继……之后”用 following / after；“与……相联”be associated with；“首选”the first choice for。"},{"year":"2019年6月","set":"第二套","topic":"灯笼","kind":"真题","zh":"灯笼起源于东汉，最初主要用于照明。在唐代，人们用红灯笼来庆祝安定的生活；从那时起，灯笼在中国的许多地方流行起来。灯笼通常用色彩鲜艳的薄纸制作，形状和尺寸各异。在中国传统文化中，红灯笼象征生活美满和生意兴隆，通常在春节、元宵节等节日期间悬挂。如今，世界上许多其他地方也能看到红灯笼。","en":"Lanterns originated in the Eastern Han Dynasty and were first used mainly for lighting. In the Tang Dynasty, red lanterns were used to celebrate a peaceful life; since then lanterns have become popular in many parts of China. Lanterns are usually made of thin paper in bright colors and come in different shapes and sizes. In traditional Chinese culture, red lanterns symbolize a happy life and a booming business, and are usually hung during festivals such as the Spring Festival and the Lantern Festival. Today, red lanterns can also be seen in many other parts of the world.","terms":["originate in","be used for lighting","in different shapes and sizes","symbolize","a booming business","be hung during festivals"],"note":"“形状和尺寸各异”come in different shapes and sizes；“悬挂”用 hang（被动 hung），注意不要写成 hanged。"},{"year":"2019年6月","set":"第三套","topic":"舞狮","kind":"真题","zh":"舞狮作为中国传统民间表演已有2000多年历史。在狮子舞中，两位表演者同披一件狮子服，一个舞动头部，另一个舞动身体和尾巴。他们熟练配合，模仿狮子的各种动作。狮子是兽中之王，象征幸福和好运，所以人们通常在春节和其他节日期间表演狮子舞。狮子舞也可能出现在其他重要场合，如商店开业和结婚典礼，往往吸引许多人观赏。","en":"Lion dancing, a traditional Chinese folk performance, has a history of more than 2,000 years. In the dance, two performers share one lion costume, with one controlling the head and the other moving the body and the tail. They cooperate skillfully to imitate the various movements of a lion. As the king of beasts, the lion symbolizes happiness and good luck, so lion dancing is usually performed during the Spring Festival and other festivals. It may also appear on important occasions such as shop openings and wedding ceremonies, often attracting large crowds.","terms":["folk performance","share one lion costume","cooperate skillfully","the king of beasts","wedding ceremonies","attracting large crowds"],"note":"用同位语可省一个从句；“配合默契”cooperate skillfully；“吸引许多人观赏”用现在分词作结果状语。"},{"year":"文化专题","set":"训练","topic":"茶文化","kind":"文化","zh":"中国是茶的故乡，饮茶的历史已有数千年。唐代陆羽所著的《茶经》是世界上第一部关于茶的专著。中国人饮茶不仅为了解渴，更把它当作一种修身养性的方式。在长期的实践中，人们总结出茶道精神：和、静、怡、真。今天，茶仍然是中国人待客的重要方式，客人来访时，主人通常会先奉上一杯热茶。","en":"China is the home of tea, and tea drinking there dates back thousands of years. The Classic of Tea, written by Lu Yu in the Tang Dynasty, is the world's first monograph on tea. The Chinese drink tea not only to quench their thirst but also as a way of cultivating their mind. Through long practice, people have summed up the spirit of the tea ceremony: harmony, tranquility, joy and truth. Today, tea is still an important way for the Chinese to treat guests: when a guest arrives, the host usually offers a cup of hot tea first.","terms":["the home of tea","date back thousands of years","the first monograph on tea","quench one's thirst","cultivate one's mind","treat guests"],"note":"“故乡”the home of；“不仅……更……”not only ... but also；“待人接物 / 待客”treat guests。"},{"year":"文化专题","set":"训练","topic":"长城","kind":"文化","zh":"长城是中国古代一项伟大的防御工程，全长两万多公里。它始建于春秋战国时期，秦始皇统一中国后把各段城墙连接起来，现存的大部分城墙是明代修筑的。长城蜿蜒于群山之间，气势雄伟，被视为中华民族坚韧不拔精神的象征。1987年，长城被列入世界文化遗产名录，如今每年吸引着成千上万的游客。","en":"The Great Wall is a great defense project of ancient China, stretching more than 20,000 kilometers. Its construction began in the Spring and Autumn and Warring States periods; after Qin Shi Huang unified China, he had the separate walls joined together, and most of the walls that survive today were built in the Ming Dynasty. Winding through the mountains, the Great Wall looks magnificent and is regarded as a symbol of the perseverance of the Chinese nation. In 1987 it was inscribed on the World Heritage List, and today it attracts tens of thousands of visitors every year.","terms":["a great defense project","unify China","most of the walls that survive today","wind through the mountains","be regarded as a symbol of","the World Heritage List"],"note":"“全长……”用现在分词 stretching；“气势雄伟”magnificent；“被列入”be inscribed on / be listed as。"},{"year":"文化专题","set":"训练","topic":"京剧","kind":"文化","zh":"京剧是中国影响最大的戏曲剧种，形成于清代乾隆年间，至今已有两百多年历史。它集唱、念、做、打于一体，角色分为生、旦、净、丑四大行当。京剧的唱腔优美，服装华丽，脸谱色彩鲜明，不同的颜色代表不同的性格。京剧被誉为“国粹”，2010年被列入联合国教科文组织人类非物质文化遗产代表作名录。","en":"Peking Opera is the most influential form of traditional Chinese opera. It took shape during the reign of Emperor Qianlong in the Qing Dynasty and has a history of more than 200 years. It combines singing, recitation, acting and acrobatic fighting, and its roles fall into four major types: sheng, dan, jing and chou. Peking Opera is known for its beautiful singing, splendid costumes and striking facial makeup, in which different colors stand for different personalities. Hailed as the national quintessence of China, it was added to UNESCO's Representative List of the Intangible Cultural Heritage of Humanity in 2010.","terms":["the most influential form","take shape","singing, recitation, acting and acrobatic fighting","facial makeup","the national quintessence","intangible cultural heritage"],"note":"“集……于一体”combine；“被誉为”hailed as / known as；“非物质文化遗产”的固定译法要记牢。"},{"year":"文化专题","set":"训练","topic":"书法","kind":"文化","zh":"书法是中国特有的一种艺术形式，以毛笔、墨和宣纸为工具。它不仅要求书写者掌握正确的笔法，还讲究结构的匀称和气韵的流畅。历代书法家留下了大量珍贵的作品，王羲之的《兰亭序》被誉为“天下第一行书”。练习书法可以磨练意志、陶冶性情，因此至今仍是许多中国孩子的必修课。","en":"Calligraphy is an art form unique to China, using a writing brush, ink and xuan paper as its tools. It requires the writer not only to master the correct techniques of the brush but also to achieve balanced structure and flowing rhythm. Calligraphers of past dynasties have left a large number of precious works, among which Wang Xizhi's Preface to the Orchid Pavilion is praised as \"the finest running script under heaven\". Practising calligraphy can temper one's will and cultivate one's taste, so it remains a required course for many Chinese children today.","terms":["an art form unique to China","a writing brush","master the correct techniques","flowing rhythm","be praised as","cultivate one's taste"],"note":"“讲究……匀称与流畅”用 achieve 搭配抽象名词；“陶冶性情”cultivate one's taste；“必修课”a required course。"},{"year":"文化专题","set":"训练","topic":"春节","kind":"文化","zh":"春节是中国最重要的传统节日，标志着农历新年的开始。节前，人们打扫房屋、贴春联、准备年货；除夕之夜，全家人围坐在一起吃年夜饭、看春节联欢晚会。长辈会给孩子们压岁钱，寓意平安吉祥。春节期间，人们走亲访友、互相拜年，到处洋溢着喜庆的气氛。春节不仅是一个节日，更承载着中国人对家庭团圆的珍视。","en":"The Spring Festival is the most important traditional festival in China, marking the beginning of the lunar new year. Before the festival, people clean their houses, put up spring couplets and prepare festival goods. On New Year's Eve, the whole family sits around the table for the reunion dinner and watches the Spring Festival gala. Elders give children lucky money, which stands for peace and good fortune. During the festival, people visit relatives and friends and exchange New Year greetings, and a festive atmosphere is everywhere. The Spring Festival is more than a festival; it carries the Chinese people's deep love for family reunion.","terms":["mark the beginning of","put up spring couplets","New Year's Eve","the reunion dinner","lucky money","exchange New Year greetings"],"note":"“贴春联”put up spring couplets；“除夕”New Year's Eve；“承载着……珍视”carry one's love for。"},{"year":"文化专题","set":"训练","topic":"丝绸之路","kind":"文化","zh":"丝绸之路是古代连接中国与中亚、西亚和欧洲的贸易通道，因中国丝绸经此西运而得名。公元前二世纪，张骞奉命出使西域，为这条道路的开通奠定了基础。沿着丝绸之路，中国的丝绸、瓷器和造纸术传向西方，而葡萄、胡椒和佛教等则传入中国。它不仅是一条商贸之路，也是东西方文化交流的桥梁。","en":"The Silk Road was an ancient trade route linking China with Central Asia, West Asia and Europe. It got its name because Chinese silk was carried westward along it. In the second century BC, Zhang Qian was sent on a mission to the Western Regions, which laid the foundation for the opening of this route. Along the Silk Road, Chinese silk, porcelain and papermaking spread to the West, while grapes, pepper and Buddhism were introduced into China. It was not only a road of trade but also a bridge for cultural exchange between East and West.","terms":["a trade route linking","get its name because","be sent on a mission to","lay the foundation for","spread to the West","be introduced into China"],"note":"“因……而得名”get its name because；“出使西域”be sent on a mission to the Western Regions；“传播 / 传入”spread / be introduced。"},{"year":"文化专题","set":"训练","topic":"中医","kind":"文化","zh":"中医是中国传统医学的总称，已有两千多年的历史。它认为人体是一个有机的整体，强调阴阳平衡和人与自然的和谐。中医通过望、闻、问、切四种方法诊断疾病，采用中药、针灸、推拿等手段进行治疗。与西医相比，中医更注重预防疾病和整体调理。近年来，中医逐渐被世界许多国家的人们所接受。","en":"Traditional Chinese medicine (TCM) is a general term for China's traditional medical science, with a history of more than 2,000 years. It regards the human body as an organic whole and stresses the balance of yin and yang as well as harmony between man and nature. TCM diagnoses diseases through four methods — observation, listening, questioning and pulse reading — and treats patients with Chinese herbal medicine, acupuncture and massage. Compared with Western medicine, it pays more attention to preventing disease and regulating the whole body. In recent years, TCM has gradually been accepted by people in many countries.","terms":["a general term for","an organic whole","the balance of yin and yang","diagnose diseases","Chinese herbal medicine","regulating the whole body"],"note":"“总称”a general term for；“望闻问切”可四诊合译；“被……所接受”be accepted by。"},{"year":"文化专题","set":"训练","topic":"中国园林","kind":"文化","zh":"中国园林是把人工的山石、水体、植物和建筑与自然环境巧妙结合的一种艺术。它讲究“虽由人作，宛自天开”，追求自然、含蓄和意境。苏州园林是中国园林的代表，其中拙政园、留园等已被列入世界文化遗产名录。中国园林不仅是居住和游赏的场所，也体现了中国人对人与自然和谐相处的向往。","en":"The Chinese garden is an art that skillfully combines man-made rockeries, water, plants and buildings with the natural environment. It values the idea that \"though made by man, it looks as if it were created by nature\", seeking naturalness, subtlety and artistic conception. The gardens of Suzhou are representative of Chinese gardens, and several of them, such as the Humble Administrator's Garden and the Lingering Garden, have been inscribed on the World Heritage List. A Chinese garden is not only a place for living and sightseeing but also an expression of the Chinese people's longing for harmony between man and nature.","terms":["man-made rockeries","the natural environment","artistic conception","be representative of","be inscribed on the World Heritage List","harmony between man and nature"],"note":"“虽由人作，宛自天开”可用 though 句式意译；“意境”artistic conception；“向往”longing for。"}]}</script>
<script>
(() => {
  'use strict';

  /* ============================================================
     词途 CET4 — 单页离线学习应用
     数据内嵌，进度保存在 localStorage，无后端、无外部依赖。
     ============================================================ */

  const DATA = JSON.parse(document.getElementById('app-data').textContent);
  const BUILTIN_WORDS = (DATA.words || []).map((w, i) => ({ ...w, id: i }));
  const BUILTIN_PHRASES = (DATA.phrases || []).map((p, i) => ({ ...p, id: i }));
  const TERMS = (DATA.terms || []).map((t, i) => ({ ...t, id: i }));
  const BUILTIN_SENTENCES = (DATA.sentences || []).map((s, i) => ({ ...s, id: i }));
  const EXAMS = (DATA.exams || []).map((e, i) => ({ ...e, id: i }));
  const CONFUSE_GROUPS = DATA.confuseGroups || [];
  const PHRASE_GROUPS = DATA.phraseGroups || [];

  // 内置词库 + 用户导入词库，运行时可重建（导入后立即生效）
  let WORDS = BUILTIN_WORDS;
  let PHRASES = BUILTIN_PHRASES;
  let SENTENCES = BUILTIN_SENTENCES;
  let WORD_BY_ID = new Map();
  let WORD_BY_KEY = new Map();
  let PHRASE_BY_ID = new Map();
  let TERM_BY_ID = new Map(TERMS.map(t => [t.id, t]));
  let SENTENCE_BY_ID = new Map();
  const EXAM_BY_ID = new Map(EXAMS.map(e => [e.id, e]));
  const confuseCache = new Map();

  const STORE_KEY = 'cet4_wordway_v1';
  const DAY_MS = 86400000;
  const LEVEL_DAYS = [0, 1, 2, 4, 7, 15, 30, 60];

  const NAV = [
    { route: 'home', label: '首页', icon: 'home' },
    { route: 'words', label: '背单词', icon: 'book' },
    { route: 'phrases', label: '背词组', icon: 'layers' },
    { route: 'translate', label: '翻译训练', icon: 'translate' },
    { route: 'quiz', label: '测试', icon: 'quiz' },
    { route: 'notebook', label: '错题本', icon: 'notebook' },
    { route: 'import', label: '导入词库', icon: 'upload' },
    { route: 'stats', label: '学习数据', icon: 'chart' },
    { route: 'settings', label: '设置', icon: 'settings' }
  ];
  const MOBILE_NAV = ['home', 'words', 'phrases', 'translate', 'quiz', 'notebook'];
  const PAGE_META = {
    home: ['今日学习', '把每天的小目标，走成一条长长的路'],
    words: ['背单词', '看词义、听发音，顺手认清那些长得像的词'],
    phrases: ['背词组', '固定搭配要成组记，别让介词偷换了意思'],
    translate: ['翻译训练', '先自己写，再和参考译文对照'],
    quiz: ['测试', '用选择题和拼写，检验今天真正记住了多少'],
    notebook: ['错题本', '错过的词不会消失，它们会变成你的复习清单'],
    import: ['导入词库', '把课本、笔记或单词表贴进来，立刻变成可背诵的词卡'],
    stats: ['学习数据', '看见积累，也看见下一步该补哪里'],
    settings: ['设置', '每日计划、数据备份与偏好都在这里']
  };

  const root = document.getElementById('main');
  const toastEl = document.getElementById('toast');
  const modalRoot = document.getElementById('modal-root');

  const ui = {
    route: 'home',
    wordsTab: 'study',
    wordsScope: 'today',
    phrasesTab: 'study',
    phrasesScope: 'today',
    libSearch: '',
    phraseSearch: '',
    reveal: false,
    termRevealed: false,
    termOrder: [],
    termPos: 0,
    sentenceRevealed: false,
    sentenceDraft: '',
    translateTab: 'sentence',
    notebookFilter: 'all',
    notebookOpen: '',
    quiz: null,
    quizConfig: { scope: 'today_words', type: 'mixed', count: 10 },
    quizInput: '',
    quizAnswered: false,
    allStudy: new Set(),
    examId: null,
    examDraft: '',
    examRevealed: false,
    examManual: false,
    examFilter: 'all',
    importPhase: 'idle',
    importTarget: 'auto',
    importName: '',
    importText: '',
    importRows: [],
    importErrors: [],
    importKept: 0
  };

  /* ---------------- state ---------------- */

  function defaultState() {
    return {
      v: 1,
      createdAt: Date.now(),
      settings: {
        dailyWords: 20,
        dailyPhrases: 10,
        dailyTranslations: 3,
        reviewLimit: 20,
        theme: 'auto',
        sound: true
      },
      words: {},
      phrases: {},
      terms: {},
      sentences: {},
      exams: {},
      custom: { seq: 100000, words: [], phrases: [], sentences: [], batches: [] },
      wrong: {},
      daily: {},
      stats: { byDate: {}, totals: { words: 0, phrases: 0, sentences: 0, terms: 0, exams: 0, quizzes: 0, correct: 0, wrong: 0 } }
    };
  }

  function mergeState(base, incoming) {
    if (!incoming || typeof incoming !== 'object') return base;
    const out = base;
    for (const key of Object.keys(incoming)) {
      if (key === 'settings' || key === 'stats' || key === 'daily') continue;
      if (incoming[key] && typeof incoming[key] === 'object' && !Array.isArray(incoming[key])) {
        out[key] = { ...(out[key] || {}), ...incoming[key] };
      }
    }
    out.settings = { ...base.settings, ...(incoming.settings || {}) };
    out.stats = {
      ...base.stats,
      ...(incoming.stats || {}),
      totals: { ...base.stats.totals, ...((incoming.stats || {}).totals || {}) },
      byDate: { ...((incoming.stats || {}).byDate || {}) }
    };
    out.daily = { ...(incoming.daily || {}) };
    return out;
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return defaultState();
      return mergeState(defaultState(), JSON.parse(raw));
    } catch (err) {
      console.warn('读取本地进度失败', err);
      return defaultState();
    }
  }

  let state = loadState();
  let saveWarned = false;

  /* ---------------- pools (builtin + imported) ---------------- */

  function customDeck() {
    if (!state.custom || typeof state.custom !== 'object') state.custom = defaultState().custom;
    const c = state.custom;
    if (!Array.isArray(c.words)) c.words = [];
    if (!Array.isArray(c.phrases)) c.phrases = [];
    if (!Array.isArray(c.sentences)) c.sentences = [];
    if (!Array.isArray(c.batches)) c.batches = [];
    if (typeof c.seq !== 'number' || !isFinite(c.seq)) c.seq = 100000;
    return c;
  }

  function rebuildPools() {
    const c = customDeck();
    WORDS = BUILTIN_WORDS.concat(c.words);
    PHRASES = BUILTIN_PHRASES.concat(c.phrases);
    SENTENCES = BUILTIN_SENTENCES.concat(c.sentences);
    WORD_BY_ID = new Map(WORDS.map(w => [w.id, w]));
    WORD_BY_KEY = new Map(WORDS.map(w => [String(w.w).toLowerCase(), w]));
    PHRASE_BY_ID = new Map(PHRASES.map(p => [p.id, p]));
    SENTENCE_BY_ID = new Map(SENTENCES.map(s => [s.id, s]));
    confuseCache.clear();
  }

  rebuildPools();

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (err) {
      if (!saveWarned) {
        saveWarned = true;
        toast('浏览器存储空间不足，请先导出备份并清理数据');
      }
    }
  }

  /* ---------------- utils ---------------- */

  const $ = (sel, el = document) => el.querySelector(sel);
  const $$ = (sel, el = document) => Array.from(el.querySelectorAll(sel));
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function todayKey(d = new Date()) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function dateFromKey(key) {
    const [y, m, d] = key.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function addDays(key, n) {
    const d = dateFromKey(key);
    d.setDate(d.getDate() + n);
    return todayKey(d);
  }

  function dayNumber(key = todayKey()) {
    return Math.floor(dateFromKey(key).getTime() / DAY_MS);
  }

  function fmtShortDate(key) {
    const d = dateFromKey(key);
    return `${d.getMonth() + 1}/${d.getDate()}`;
  }

  const WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];
  function weekdayCN(key) {
    return WEEK_CN[dateFromKey(key).getDay()];
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function sample(arr, n) {
    return shuffle(arr).slice(0, n);
  }

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function uniq(arr) {
    return Array.from(new Set(arr));
  }

  function pct(n, d) {
    if (!d) return 0;
    return Math.round((n / d) * 100);
  }

  function fmtCount(n) {
    if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + 'w';
    return String(n);
  }

  function plural(n, unit) {
    return `${n} ${unit}`;
  }

  function getGreeting() {
    const h = new Date().getHours();
    if (h < 6) return '夜深了，学一点就休息';
    if (h < 11) return '早上好，今天也向前一点';
    if (h < 14) return '中午好，来一组词清醒一下';
    if (h < 18) return '下午好，把今天的目标收个尾';
    return '晚上好，今天想记住多少个词？';
  }

  let toastTimer = 0;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }

  function icon(name, cls = 'icon') {
    return `<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  }

  function themeIsDark() {
    const t = state.settings.theme;
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function applyTheme() {
    document.documentElement.dataset.theme = themeIsDark() ? 'dark' : 'light';
    $$('[data-action="toggle-theme"]').forEach(btn => { btn.innerHTML = icon(themeIsDark() ? 'sun' : 'moon'); });
    const meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', themeIsDark() ? '#10171b' : '#0f766e');
  }

  function speak(text) {
    if (!state.settings.sound) {
      toast('发音已关闭，可在设置中开启');
      return;
    }
    if (!('speechSynthesis' in window)) {
      toast('当前浏览器不支持语音朗读');
      return;
    }
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      u.rate = 0.88;
      const voices = window.speechSynthesis.getVoices();
      const v = voices.find(x => /en[-_]US/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang));
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (err) { /* ignore */ }
  }

  function normalizeAnswer(s) {
    return String(s || '').toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  /* 关键词命中判断：允许词形变化（be based on / are based on、originate / originated） */
  const AUX_ALTS = { be: ['is', 'are', 'was', 'were', 'been', 'being', 'am'] };

  function tokenAlts(tok) {
    const out = [tok];
    if (AUX_ALTS[tok]) out.push(...AUX_ALTS[tok]);
    if (tok.length > 3) {
      out.push(tok + 's', tok + 'ed', tok + 'ing');
      if (/e$/.test(tok)) out.push(tok.slice(0, -1) + 'ing', tok + 'd');
      if (/y$/.test(tok)) out.push(tok.slice(0, -1) + 'ies', tok.slice(0, -1) + 'ied');
      if (/[^aeiou][aeiou][bdgklmnprt]$/.test(tok)) {
        out.push(tok + tok.slice(-1) + 'ed', tok + tok.slice(-1) + 'ing');
      }
    }
    return out;
  }

  function stemEq(a, b) {
    if (a === b) return true;
    if (a.length < 4 || b.length < 4) return false;
    const short = a.length <= b.length ? a : b;
    const long = a.length <= b.length ? b : a;
    if (long.length - short.length > 3) return false;
    return long.startsWith(short);
  }

  function termHit(draft, term) {
    const d = normalizeAnswer(draft);
    const t = normalizeAnswer(term);
    if (!d || !t) return false;
    if (d.includes(t)) return true;
    const dt = d.split(' ').filter(Boolean);
    const tt = t.split(' ').filter(Boolean);
    if (!tt.length || !dt.length) return false;
    let i = 0;
    for (const tok of tt) {
      const alts = tokenAlts(tok);
      let ok = false;
      while (i < dt.length) {
        const w = dt[i++];
        if (alts.some(a => stemEq(w, a))) { ok = true; break; }
      }
      if (!ok) return false;
    }
    return true;
  }

  function download(filename, text, type = 'application/json') {
    const blob = new Blob([text], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);

  function copyText(text) {
    const t = String(text || '');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(() => toast('参考译文已复制'), () => toast('复制失败，请手动选中'));

  /* ---------------- SRS / stats ---------------- */

  function wordState(id) {
    return state.words[id] || null;
  }

  function dueWordIds() {
    const now = Date.now();
    return WORDS.filter(w => {
      const s = state.words[w.id];
      return s && s.seen > 0 && (s.due || 0) <= now;
    }).sort((a, b) => (state.words[a.id].due || 0) - (state.words[b.id].due || 0));
  }

  function duePhraseIds() {
    const now = Date.now();
    return PHRASES.filter(p => {
      const s = state.phrases[p.id];
      return s && s.seen > 0 && (s.due || 0) <= now;
    }).sort((a, b) => (state.phrases[a.id].due || 0) - (state.phrases[b.id].due || 0));
  }

  function budgetDate(key) {
    const d = dateFromKey(key);
    d.setHours(23, 59, 59, 999);
    return d.getTime();
  }

  function makeDaily(key) {
    const newWords = WORDS.filter(w => !state.words[w.id] || !state.words[w.id].seen)
      .slice(0, Math.max(0, state.settings.dailyWords)).map(w => w.id);
    const reviewWords = dueWordIds()
      .filter(w => state.words[w.id].due <= budgetDate(key))
      .slice(0, Math.max(0, state.settings.reviewLimit)).map(w => w.id);
    const newPhrases = PHRASES.filter(p => !state.phrases[p.id] || !state.phrases[p.id].seen)
      .slice(0, Math.max(0, state.settings.dailyPhrases)).map(p => p.id);
    const target = Math.max(0, state.settings.dailyTranslations);
    const offset = Math.abs(dayNumber(key)) % Math.max(1, SENTENCES.length);
    const sentenceIds = [];
    for (let i = 0; i < SENTENCES.length && sentenceIds.length < target; i++) {
      sentenceIds.push(SENTENCES[(offset + i) % SENTENCES.length].id);
    }
    return {
      date: key,
      w: uniq(newWords),
      r: uniq(reviewWords),
      p: uniq(newPhrases),
      s: uniq(sentenceIds),
      done: { w: [], r: [], p: [], s: [] }
    };
  }

  function getDaily() {
    const key = todayKey();
    if (!state.daily[key]) {
      state.daily[key] = makeDaily(key);
      save();
    }
    const d = state.daily[key];
    d.done = d.done || { w: [], r: [], p: [], s: [] };
    for (const k of ['w', 'r', 'p', 's', 'done']) if (!d[k]) d[k] = [];
    for (const k of ['w', 'r', 'p', 's']) if (!d.done[k]) d.done[k] = [];
    return d;
  }

  function resetDaily() {
    delete state.daily[todayKey()];
    save();
    getDaily();
  }

  function dayStats(key = todayKey()) {
    if (!state.stats.byDate[key]) state.stats.byDate[key] = {};
    return state.stats.byDate[key];
  }

  function bumpStat(kind, n = 1) {
    const d = dayStats();
    d[kind] = (d[kind] || 0) + n;
    state.stats.totals[kind] = (state.stats.totals[kind] || 0) + n;
  }

  function bumpCorrect(n = 1) {
    bumpStat('correct', n);
    state.stats.totals.correct = state.stats.totals.correct || 0;
  }

  function bumpWrong(n = 1) {
    bumpStat('wrong', n);
    state.stats.totals.wrong = state.stats.totals.wrong || 0;
  }

  function computeStreak() {
    let key = todayKey();
    if (!(state.stats.byDate[key] && (state.stats.byDate[key].words || state.stats.byDate[key].phrases || state.stats.byDate[key].sentences || state.stats.byDate[key].exams || state.stats.byDate[key].quizzes || state.stats.byDate[key].terms))) {
      key = addDays(key, -1);
    }
    let n = 0;
    for (let i = 0; i < 4000; i++) {
      const s = state.stats.byDate[key];
      if (s && (s.words || s.phrases || s.sentences || s.exams || s.quizzes || s.terms)) {
        n++;
        key = addDays(key, -1);
      } else break;
    }
    return n;
  }

  function activeOn(key) {
    const s = state.stats.byDate[key];
    return !!(s && (s.words || s.phrases || s.sentences || s.exams || s.quizzes || s.terms));
  }

  function reviewWord(id, quality) {
    const now = Date.now();
    let s = state.words[id];
    if (!s) s = state.words[id] = { seen: 0, correct: 0, wrong: 0, level: 0, due: now, last: 0 };
    s.seen = (s.seen || 0) + 1;
    s.last = now;
    if (quality === 2) {
      s.correct = (s.correct || 0) + 1;
      s.level = clamp((s.level || 0) + 1, 1, 7);
      s.due = now + LEVEL_DAYS[s.level] * DAY_MS;
      bumpCorrect();
    } else if (quality === 1) {
      s.level = clamp(s.level || 0, 1, 7);
      s.due = now + Math.max(1, Math.floor(LEVEL_DAYS[s.level] / 2)) * DAY_MS;
    } else {
      s.wrong = (s.wrong || 0) + 1;
      s.level = 0;
      s.due = now + 10 * 60000;
      bumpWrong();
    }
    bumpStat('words');
    save();
  }

  function reviewPhrase(id, quality) {
    const now = Date.now();
    let s = state.phrases[id];
    if (!s) s = state.phrases[id] = { seen: 0, correct: 0, wrong: 0, level: 0, due: now, last: 0 };
    s.seen = (s.seen || 0) + 1;
    s.last = now;
    if (quality === 2) {
      s.correct = (s.correct || 0) + 1;
      s.level = clamp((s.level || 0) + 1, 1, 7);
      s.due = now + LEVEL_DAYS[s.level] * DAY_MS;

    } else if (quality === 1) {

    } else {

  function reviewTerm(id, good) {
    const now = Date.now();
    let s = state.terms[id];
    if (!s) s = state.terms[id] = { seen: 0, correct: 0, wrong: 0, level: 0, due: now, last: 0 };
    s.seen++;
    s.last = now;
    if (good) {
      s.correct++;
      s.level = clamp((s.level || 0) + 1, 1, 7);
      s.due = now + LEVEL_DAYS[s.level] * DAY_MS;
      bumpCorrect();
    } else {
      s.wrong++;
      s.level = 0;
      s.due = now + 10 * 60000;
      bumpWrong();
    }
    bumpStat('terms');

  }

  function reviewSentence(id, good) {
    const now = Date.now();
    let s = state.sentences[id];
    if (!s) s = state.sentences[id] = { seen: 0, correct: 0, wrong: 0, level: 0, due: now, last: 0 };
    s.seen++;
    s.last = now;
    if (good) {
      s.correct++;
      s.level = clamp((s.level || 0) + 1, 1, 7);
      s.due = now + LEVEL_DAYS[s.level] * DAY_MS;

    } else {

  function reviewExam(id, good) {
    const now = Date.now();
    if (!state.exams) state.exams = {};
    let s = state.exams[id];
    if (!s) s = state.exams[id] = { seen: 0, done: false, count: 0, last: 0 };
    s.seen = (s.seen || 0) + 1;
    s.count = (s.count || 0) + 1;
    s.last = now;

  /* ---------------- wrong book ---------------- */

  function wrongKey(type, refId) {
    return `${type}:${refId}`;
  }

  function addWrong({ type, refId, prompt, correct, your, tag, detail }) {
    const key = wrongKey(type, refId);
    const now = Date.now();
    const old = state.wrong[key];
    if (old) {
      old.count = (old.count || 1) + 1;
      old.last = now;
      old.your = your || old.your;
      old.correct = correct || old.correct;
      old.prompt = prompt || old.prompt;
      old.tag = tag || old.tag;
      old.mastered = false;
      old.right = 0;
      if (detail) old.detail = detail;
    } else {
      state.wrong[key] = {
        key, type, refId, prompt, correct, your, tag: tag || '待归类',
        count: 1, right: 0, first: now, last: now, mastered: false,
        detail: detail || ''
      };
    }
    save();
  }

  function markWrongRight(key) {
    const w = state.wrong[key];
    if (!w) return;
    w.right = (w.right || 0) + 1;
    w.last = Date.now();
    if (w.right >= 2) w.mastered = true;
    save();
  }

  function wrongList(includeMastered = true) {
    return Object.values(state.wrong)
      .filter(w => includeMastered || !w.mastered)
      .sort((a, b) => b.last - a.last);
  }

  /* ---------------- confusables ---------------- */

  const curatedWordMap = new Map();
  CONFUSE_GROUPS.forEach(g => {
    (g.words || []).forEach(w => {
      const key = String(w).toLowerCase();
      if (!curatedWordMap.has(key)) curatedWordMap.set(key, []);
      curatedWordMap.get(key).push(g);
    });
  });

  function levenshtein(a, b, limit = 2) {
    if (a === b) return 0;
    if (Math.abs(a.length - b.length) > limit) return limit + 1;
    const prev = new Array(b.length + 1);
    for (let j = 0; j <= b.length; j++) prev[j] = j;
    for (let i = 1; i <= a.length; i++) {
      let cur = [i];
      let rowMin = cur[0];
      for (let j = 1; j <= b.length; j++) {
        const cost = a[i - 1] === b[j - 1] ? 0 : 1;
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
        if (cur[j] < rowMin) rowMin = cur[j];
      }
      if (rowMin > limit) return limit + 1;
      for (let j = 0; j <= b.length; j++) prev[j] = cur[j];
    }
    return prev[b.length];
  }

  function getConfusables(word) {
    const key = word.w.toLowerCase();
    if (confuseCache.has(key)) return confuseCache.get(key);
    const result = [];
    const seen = new Set([key]);
    const groups = curatedWordMap.get(key) || [];
    for (const g of groups) {
      const others = (g.words || []).map(x => String(x).toLowerCase()).filter(x => x !== key);
      for (const o of others) {
        const w = WORD_BY_KEY.get(o);
        if (w && !seen.has(o)) {
          seen.add(o);
          result.push({ w: w.w, m: w.m, tip: g.tip || '' });
        }
      }
    }
    if (result.length < 3) {
      const candidates = [];
      for (const w of WORDS) {
        const lw = w.w.toLowerCase();
        if (seen.has(lw) || lw === key) continue;
        if (lw[0] !== key[0]) continue;
        if (Math.abs(lw.length - key.length) > 2) continue;
        const dist = levenshtein(key, lw, 2);
        if (dist <= 2) candidates.push({ w: w.w, m: w.m, dist });
      }
      candidates.sort((a, b) => a.dist - b.dist || a.w.length - b.w.length);
      for (const c of candidates) {
        if (result.length >= 3) break;
        if (seen.has(c.w.toLowerCase())) continue;
        seen.add(c.w.toLowerCase());
        result.push({ w: c.w, m: c.m, tip: '' });
      }
    }
    const out = result.slice(0, 3);
    confuseCache.set(key, out);
    return out;
  }

  function getConfuseTip(word) {
    const key = word.w.toLowerCase();
    const groups = curatedWordMap.get(key) || [];
    return groups.find(g => g.tip)?.tip || '';
  }

  const phraseCuratedMap = new Map();
  PHRASE_GROUPS.forEach(g => {
    (g.words || []).forEach(w => {
      const key = String(w).toLowerCase();
      if (!phraseCuratedMap.has(key)) phraseCuratedMap.set(key, []);
      phraseCuratedMap.get(key).push(g);
    });
  });

  function getPhraseConfusables(phrase) {
    const key = phrase.p.toLowerCase();
    const groups = phraseCuratedMap.get(key) || [];
    const out = [];
    const seen = new Set([key]);
    for (const g of groups) {
      for (const other of g.words || []) {
        const ok = String(other).toLowerCase();
        if (seen.has(ok)) continue;
        const p = PHRASES.find(x => x.p.toLowerCase() === ok);
        if (p) { seen.add(ok); out.push({ p: p.p, m: p.m, tip: g.tip || '' }); }
      }
    }
    if (!out.length) {
      const words = new Set(key.split(/\s+/).filter(Boolean));
      for (const p of PHRASES) {
        if (out.length >= 2) break;
        if (p.id === phrase.id) continue;
        const pk = p.p.toLowerCase();
        if (seen.has(pk)) continue;
        const pw = new Set(pk.split(/\s+/).filter(Boolean));
        let overlap = 0;
        for (const w of words) if (pw.has(w)) overlap++;
        if (overlap >= Math.max(1, words.size - 1) && Math.abs(pk.length - key.length) < 18) {
          seen.add(pk);
          out.push({ p: p.p, m: p.m, tip: '' });
        }
      }
    }
    return out.slice(0, 2);
  }
