        </div>
        <div class="card task-card">
          <div class="task-ico">${icon('translate')}</div>
          <div><h3>今日翻译</h3><div class="meta"><span>${doneS} / ${targetS} 句文化翻译</span><b>${targetS ? pct(doneS, targetS) : 100}%</b></div>
          <div class="progress" style="margin-top:7px"><i style="width:${targetS ? pct(doneS, targetS) : 100}%"></i></div>
          <div class="go" data-route="translate">${targetS && doneS >= targetS ? '再看一遍' : '去翻译'} ${icon('arrow-right')}</div></div>
        </div>
      </div>

      <div class="row wrap mt-16">
        <button class="chip" data-action="goto-exam" data-route="translate">${icon('translate')}四级真题翻译 ${EXAMS.length} 篇 · 已练 ${EXAMS.filter(e => examIsDone(e.id)).length}</button>
        <button class="chip" data-route="import">${icon('upload')}导入我的词表（${customDeck().words.length + customDeck().phrases.length} 条）</button>
        <button class="chip" data-route="notebook">${icon('notebook')}错题 ${wrongList(false).length} 条</button>
      </div>

      <div class="home-lower">
        <section class="card card-pad">
          <div class="card-head">
            <div><h3 class="card-title">学习节奏</h3><div class="card-sub">最近 7 天的练习次数，柱越高越充实</div></div>
            <div class="tag tag-teal">${weekHtml ? `今天 ${todayDone} 次` : ''}</div>
          </div>
          <div class="activity-chart">${weekHtml}</div>
          <div class="divider"></div>
          <div class="row-between small"><span class="muted">今日建议</span><span>${recommendation()}</span></div>
        </section>
        <section class="card card-pad">
          <div class="card-head">
            <div><h3 class="card-title">最近错题</h3><div class="card-sub">错得越多，越值得再看一眼</div></div>
            <button class="btn btn-sm btn-ghost" data-route="notebook">全部 ${icon('chevron')}</button>
          </div>
          ${recentWrong || `<div class="empty" style="padding:22px 10px"><div class="empty-icon">${icon('check')}</div><h4>还没有错题</h4><p>去测试里试试，错题会自动收进来。</p></div>`}
          ${confuseGroup ? `<div class="divider"></div>
          <div class="row-between" style="margin-bottom:8px"><span class="tiny muted">今日易混</span><span class="tiny">${confuseGroup.tip ? '注意区分' : ''}</span></div>
          <div class="similar-mini">${confuseGroup.words.map(w => `<span><b class="serif">${esc(w)}</b></span>`).join('<span style="border:0;background:transparent;padding:5px 1px">/</span>')}</div>` : ''}
        </section>
      </div>`;
  }

  function recommendation() {
    const total = state.stats.totals;
    const wrongs = wrongList(false);
    if (wrongs.length >= 8) return '错题有点多了，先清一轮错题本';
    if (total.words + total.phrases < 40) return '先把每日计划跑顺，别急着加量';
    if (computeStreak() >= 7) return '连续一周了，今天可以试试拼写模式';
    return '复习优先于新词，记忆会更稳';
  }


  /* ---------------- words page ---------------- */

  function wordQueue(scope) {
    const d = getDaily();
    if (scope === 'review') {
      return d.r.filter(id => !d.done.r.includes(id)).map(id => WORD_BY_ID.get(id)).filter(Boolean);
    }
    return d.w.filter(id => !d.done.w.includes(id)).map(id => WORD_BY_ID.get(id)).filter(Boolean);
  }

  function wordScopeTotal(scope) {
    const d = getDaily();
    return scope === 'review' ? d.r.length : d.w.length;
  }

  function wordScopeDone(scope) {
    const d = getDaily();
    return scope === 'review' ? d.done.r.length : d.done.w.length;
  }

  function renderWordsPage() {
    const actions = `<button class="pill-btn" data-action="toggle-theme">${icon(themeIsDark() ? 'sun' : 'moon')}<span>主题</span></button>`;
    return `${pageHead('words', actions)}
      <div class="row-between wrap mb-16">
        <div class="seg">
          <button class="${ui.wordsTab === 'study' ? 'active' : ''}" data-action="words-tab" data-tab="study">卡片学习</button>
          <button class="${ui.wordsTab === 'library' ? 'active' : ''}" data-action="words-tab" data-tab="library">词库浏览</button>
        </div>
        <div class="row small muted"><span>${WORDS.length} 个核心词</span><span>·</span><span>${WORDS.filter(w => state.words[w.id]?.seen).length} 个已见</span></div>
      </div>
      ${ui.wordsTab === 'library' ? renderWordLibrary() : renderWordStudy()}`;
  }

  function renderWordStudy() {
    const scopes = `
      <div class="chip-row mb-16">
        <button class="chip ${ui.wordsScope === 'today' ? 'active' : ''}" data-action="word-scope" data-scope="today">今日新词</button>
        <button class="chip ${ui.wordsScope === 'review' ? 'active' : ''}" data-action="word-scope" data-scope="review">待复习 ${dueWordIds().length ? `<span style="opacity:.7">${dueWordIds().length}</span>` : ''}</button>
      </div>`;
    const queue = wordQueue(ui.wordsScope);
    const total = wordScopeTotal(ui.wordsScope);
    const done = wordScopeDone(ui.wordsScope);
    if (!queue.length) {
      return scopes + renderEmptyStudy('word', total, done);
    }
    const w = queue[0];
    const currentNo = Math.min(total, done + 1);
    const progress = total ? pct(done, total) : 0;
    const conf = getConfusables(w);
    const tip = getConfuseTip(w);
    const meaning = w.m;
    return `${scopes}
      <div class="study-wrap">
        <div class="study-top">
          <div class="study-progress">
            <div class="row-between"><span>${ui.wordsScope === 'review' ? '复习队列' : '今日新词'}</span><span>${currentNo} / ${total}</span></div>
            <div class="progress"><i style="width:${progress}%"></i></div>
          </div>
          <div class="count-note">剩余 ${queue.length} 个</div>
        </div>
        <article class="card flashcard" id="flashcard">
          <div class="fc-toolbar">
            <span class="tag ${ui.wordsScope === 'review' ? 'tag-gold' : 'tag-teal'}">${ui.wordsScope === 'review' ? '待复习' : '新词'}</span>
            <div class="row">
              <button class="speak-btn" data-action="speak" data-text="${esc(w.w)}" title="朗读">${icon('speaker')}</button>
            </div>
          </div>
          <div class="fc-word" data-action="reveal">${esc(w.w)}</div>
          ${w.p ? `<div class="fc-phonetic"><span>${esc(w.p)}</span><button class="speak-btn" data-action="speak" data-text="${esc(w.w)}" aria-label="朗读">${icon('speaker')}</button></div>` : `<div class="fc-phonetic"><span class="muted small">点击单词可显示释义</span></div>`}
          ${ui.reveal ? `
            <div class="reveal">
              <div class="reveal-meaning">${esc(meaning)}</div>
              <div class="reveal-pos">先回忆，再核对；不确定就点“模糊”，明天还会见到它。</div>
              ${conf.length ? `<div class="confuse-box">
                <div class="confuse-title">${icon('spark')}易混形近词</div>
                <div class="confuse-list">
                  ${conf.map(c => `<div class="confuse-item"><b>${esc(c.w)}</b><span>${esc(c.m)}</span></div>`).join('')}
                </div>
                ${tip ? `<div class="confuse-tip">${esc(tip)}</div>` : ''}
              </div>` : ''}
            </div>` : `
            <div class="fc-hint">${icon('eye')}按 <span class="kbd">空格</span> 或点击卡片显示释义</div>`}
        </article>
        ${ui.reveal ? `
          <div class="rate-bar">
            <button class="rate-btn bad" data-action="rate-word" data-q="0"><b>不认识</b><span>重新学</span></button>
            <button class="rate-btn mid" data-action="rate-word" data-q="1"><b>有点模糊</b><span>明天再见</span></button>
            <button class="rate-btn good" data-action="rate-word" data-q="2"><b>记住了</b><span>拉长间隔</span></button>
          </div>
          <div class="center mt-12 tiny muted">快捷键：<span class="kbd">1</span> 不认识 · <span class="kbd">2</span> 模糊 · <span class="kbd">3</span> 记住</div>` : `
          <div class="center mt-16"><button class="btn btn-primary" data-action="reveal">${icon('eye')}显示释义</button></div>`}
      </div>`;
  }

  function renderEmptyStudy(kind, total, done) {
    const isReview = kind === 'word' ? ui.wordsScope === 'review' : ui.phrasesScope === 'review';
    const allDone = total > 0 && done >= total;
    const nextScope = isReview ? (kind === 'word' ? 'today' : 'today') : 'review';
    const hasNext = kind === 'word'
      ? wordQueue(isReview ? 'today' : 'review').length > 0
      : phraseQueue(isReview ? 'today' : 'review').length > 0;
    const title = allDone ? (isReview ? '这轮复习完成了' : '今天的新词学完了') : (isReview ? '暂时没有待复习的词' : '今天没有安排新词');
    const desc = allDone
      ? `完成了 ${done} 个${isReview ? '复习' : '新词'}。记忆需要间隔，明天再来一次会更牢。`
      : '可以去设置里调整每日计划，或者直接开始测试。';
    return `<div class="finish-card card">
      <div class="finish-badge">${icon('check')}</div>
      <h2>${title}</h2>
      <p>${desc}</p>
      <div class="finish-stats">
        <div class="metric"><b>${done}</b><span>已完成</span></div>
        <div class="metric"><b>${state.words ? Object.keys(state.words).length : 0}</b><span>学过的词</span></div>
        <div class="metric"><b>${computeStreak()}</b><span>连续天数</span></div>
      </div>
      <div class="finish-actions">
        ${hasNext ? `<button class="btn btn-primary" data-action="${kind}-scope" data-scope="${nextScope}">${icon('arrow-right')}去${nextScope === 'review' ? '复习' : '学新词'}</button>` : ''}
        <button class="btn btn-ghost" data-route="quiz">${icon('quiz')}做一组测试</button>
        <button class="btn btn-ghost" data-route="settings">${icon('settings')}调整计划</button>
      </div>
    </div>`;
  }

  function renderWordLibrary() {
    const initial = filterWordList(ui.libSearch).slice(0, 60);
    return `<div class="card card-pad">
      <div class="row-between wrap mb-12">
        <div><h3 class="card-title">词库</h3><div class="card-sub">搜英文或中文释义，点击查看形近词与掌握状态</div></div>
        <div class="search-box">${icon('search')}<input id="lib-search" type="search" placeholder="搜索单词或释义…" value="${esc(ui.libSearch)}" autocomplete="off"></div>
      </div>
      <div class="library-grid" id="lib-grid">${initial.map(libWordCard).join('')}</div>
      <div class="center mt-16 tiny muted" id="lib-count">${filterWordList(ui.libSearch).length} 个结果</div>
    </div>`;
  }

  function filterWordList(q) {
    const s = String(q || '').trim().toLowerCase();
    if (!s) return WORDS;
    return WORDS.filter(w => w.w.toLowerCase().includes(s) || w.m.toLowerCase().includes(s));
  }

  function libWordCard(w) {
    const st = state.words[w.id];
    const lvl = st ? st.level : 0;
    return `<button class="lib-item" data-action="lib-word" data-id="${w.id}">
      <div class="lw"><span>${esc(w.w)}</span>${w.src === 'import' ? `<span class="tag tag-gold" style="font-size:9px">导入</span>` : ''}${lvl >= 4 ? `<span class="tag tag-green" style="font-size:9px">已掌握</span>` : st && st.seen ? `<span class="tag" style="font-size:9px">L${lvl}</span>` : ''}</div>
      <div class="lm">${esc(w.m)}</div>
      ${w.p ? `<div class="lp">${esc(w.p)}</div>` : ''}
    </button>`;
  }

  function refreshLibrary() {
    const grid = $('#lib-grid');
    if (!grid) return;
    const list = filterWordList(ui.libSearch);
    grid.innerHTML = list.slice(0, 80).map(libWordCard).join('') || `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">${icon('search')}</div><h4>没有找到</h4><p>换个关键词试试。</p></div>`;
    const count = $('#lib-count');
    if (count) count.textContent = list.length > 80 ? `显示前 80 个，共 ${list.length} 个结果` : `${list.length} 个结果`;
  }

  /* ---------------- phrases page ---------------- */

  function phraseQueue(scope) {
    const d = getDaily();
    return d.p.filter(id => !d.done.p.includes(id)).map(id => PHRASE_BY_ID.get(id)).filter(Boolean);
  }

  function renderPhrasesPage() {
    const actions = `<button class="pill-btn" data-action="toggle-theme">${icon(themeIsDark() ? 'sun' : 'moon')}<span>主题</span></button>`;
    return `${pageHead('phrases', actions)}
      <div class="row-between wrap mb-16">
        <div class="seg">
          <button class="${ui.phrasesTab === 'study' ? 'active' : ''}" data-action="phrases-tab" data-tab="study">卡片学习</button>
          <button class="${ui.phrasesTab === 'library' ? 'active' : ''}" data-action="phrases-tab" data-tab="library">词组速查</button>
        </div>
        <div class="row small muted"><span>${PHRASES.length} 个常用搭配</span></div>
      </div>
      ${ui.phrasesTab === 'library' ? renderPhraseLibrary() : renderPhraseStudy()}`;
  }

  function renderPhraseStudy() {
    const d = getDaily();
    const queue = phraseQueue('today');
    const total = d.p.length;
    const done = d.done.p.length;
    if (!queue.length) {
      return renderEmptyStudy('phrase', total, done);
    }
    const p = queue[0];
    const conf = getPhraseConfusables(p);
    const tip = conf.find(c => c.tip)?.tip || '';
    const progress = total ? pct(done, total) : 0;
    return `<div class="study-wrap">
      <div class="study-top">
        <div class="study-progress">
          <div class="row-between"><span>今日词组</span><span>${Math.min(total, done + 1)} / ${total}</span></div>
          <div class="progress accent"><i style="width:${progress}%"></i></div>
        </div>
        <div class="count-note">剩余 ${queue.length} 个</div>
      </div>
      <article class="card flashcard" id="flashcard">
        <div class="fc-toolbar">
          <span class="tag tag-blue">固定搭配</span>
          <button class="speak-btn" data-action="speak" data-text="${esc(p.p)}" title="朗读">${icon('speaker')}</button>
        </div>
        <div class="fc-word" style="font-size:clamp(32px,5.3vw,56px);line-height:1.22;max-width:740px" data-action="reveal">${esc(p.p)}</div>
        <div class="fc-phonetic"><span class="muted small">点击词组显示释义与易混搭配</span></div>
        ${ui.reveal ? `
          <div class="reveal">
            <div class="reveal-meaning">${esc(p.m)}</div>
            ${conf.length ? `<div class="confuse-box">
              <div class="confuse-title">${icon('layers')}易混搭配</div>
              <div class="confuse-list">
                ${conf.map(c => `<div class="confuse-item"><b style="min-width:150px">${esc(c.p)}</b><span>${esc(c.m)}</span></div>`).join('')}
              </div>
              ${tip ? `<div class="confuse-tip">${esc(tip)}</div>` : ''}
            </div>` : ''}
          </div>` : `<div class="fc-hint">${icon('eye')}按 <span class="kbd">空格</span> 或点击词组显示释义</div>`}
      </article>
      ${ui.reveal ? `
        <div class="rate-bar">
          <button class="rate-btn bad" data-action="rate-phrase" data-q="0"><b>没印象</b><span>重新学</span></button>
          <button class="rate-btn mid" data-action="rate-phrase" data-q="1"><b>有点模糊</b><span>明天再见</span></button>
          <button class="rate-btn good" data-action="rate-phrase" data-q="2"><b>记住了</b><span>拉长间隔</span></button>
        </div>
        <div class="center mt-12 tiny muted">快捷键：<span class="kbd">1</span> 没印象 · <span class="kbd">2</span> 模糊 · <span class="kbd">3</span> 记住</div>` : `
        <div class="center mt-16"><button class="btn btn-primary" data-action="reveal">${icon('eye')}显示释义</button></div>`}
    </div>`;
  }

  function renderPhraseLibrary() {
    const list = filterPhraseList(ui.phraseSearch);
    return `<div class="card card-pad">
      <div class="row-between wrap mb-12">
        <div><h3 class="card-title">词组速查</h3><div class="card-sub">按英文或中文检索，点击查看易混搭配</div></div>
        <div class="search-box">${icon('search')}<input id="phrase-search" type="search" placeholder="搜索词组或释义…" value="${esc(ui.phraseSearch)}" autocomplete="off"></div>
      </div>
      <div class="library-grid" id="phrase-grid">${list.slice(0, 80).map(libPhraseCard).join('')}</div>
      <div class="center mt-16 tiny muted" id="phrase-count">${list.length} 个结果</div>
    </div>`;
  }

  function filterPhraseList(q) {
    const s = String(q || '').trim().toLowerCase();
    if (!s) return PHRASES;
    return PHRASES.filter(p => p.p.toLowerCase().includes(s) || p.m.toLowerCase().includes(s));
  }

  function libPhraseCard(p) {
    return `<button class="lib-item" data-action="lib-phrase" data-id="${p.id}">
      <div class="lw" style="font-size:14px"><span>${esc(p.p)}</span>${p.src === 'import' ? `<span class="tag tag-gold" style="font-size:9px">导入</span>` : ''}${state.phrases[p.id]?.seen ? `<span class="tag" style="font-size:9px">L${state.phrases[p.id].level || 0}</span>` : ''}</div>
      <div class="lm" style="white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical">${esc(p.m)}</div>
    </button>`;
  }

  function refreshPhraseLibrary() {
    const grid = $('#phrase-grid');
    if (!grid) return;
    const list = filterPhraseList(ui.phraseSearch);
    grid.innerHTML = list.slice(0, 80).map(libPhraseCard).join('') || `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">${icon('search')}</div><h4>没有找到</h4><p>换个关键词试试。</p></div>`;
    const count = $('#phrase-count');
    if (count) count.textContent = list.length > 80 ? `显示前 80 个，共 ${list.length} 个结果` : `${list.length} 个结果`;
  }

  /* ---------------- detail modal ---------------- */

  function openWordModal(id) {
    const w = WORD_BY_ID.get(Number(id));
    if (!w) return;
    const st = state.words[w.id];
    const conf = getConfusables(w);
    const tip = getConfuseTip(w);
    modalRoot.innerHTML = `<div class="modal-mask" data-modal-mask>
      <div class="modal" role="dialog" aria-modal="true" aria-label="单词详情">
        <div class="row-between" style="margin-bottom:2px"><span class="tag tag-teal">单词详情</span><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('x')}</button></div>
        <h3 class="serif" style="font-size:38px;margin:12px 0 2px">${esc(w.w)}</h3>
        ${w.p ? `<div class="fc-phonetic" style="margin-top:0"><span>${esc(w.p)}</span><button class="speak-btn" data-action="speak" data-text="${esc(w.w)}">${icon('speaker')}</button></div>` : ''}
        <p style="font-size:16px;color:var(--ink);margin:14px 0 0;line-height:1.7">${esc(w.m)}</p>
        ${conf.length ? `<div class="confuse-box"><div class="confuse-title">${icon('spark')}易混形近词</div>${conf.map(c => `<div class="confuse-item"><b>${esc(c.w)}</b><span>${esc(c.m)}</span></div>`).join('')}${tip ? `<div class="confuse-tip">${esc(tip)}</div>` : ''}</div>` : ''}
        <div class="row-between mt-16" style="gap:8px;flex-wrap:wrap">
          <span class="tiny muted">${st ? `已见 ${st.seen} 次 · 正确 ${st.correct || 0} 次 · 错误 ${st.wrong || 0} 次` : '还没有学习记录'}</span>
          <div class="row">
            <button class="btn btn-sm btn-ghost" data-action="word-make-due" data-id="${w.id}">加入复习</button>
            <button class="btn btn-sm btn-soft" data-route="words" data-action="close-modal">去卡片学习</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  function openPhraseModal(id) {
    const p = PHRASE_BY_ID.get(Number(id));
    if (!p) return;
    const conf = getPhraseConfusables(p);
    const tip = conf.find(c => c.tip)?.tip || '';
    modalRoot.innerHTML = `<div class="modal-mask" data-modal-mask>
      <div class="modal" role="dialog" aria-modal="true" aria-label="词组详情">
        <div class="row-between" style="margin-bottom:2px"><span class="tag tag-blue">词组详情</span><button class="icon-btn" data-action="close-modal" aria-label="关闭">${icon('x')}</button></div>
        <h3 class="serif" style="font-size:28px;margin:12px 0 2px;line-height:1.3">${esc(p.p)}</h3>
        <p style="font-size:15px;color:var(--ink);margin:10px 0 0;line-height:1.7">${esc(p.m)}</p>
        ${conf.length ? `<div class="confuse-box"><div class="confuse-title">${icon('layers')}易混搭配</div>${conf.map(c => `<div class="confuse-item"><b style="min-width:150px">${esc(c.p)}</b><span>${esc(c.m)}</span></div>`).join('')}${tip ? `<div class="confuse-tip">${esc(tip)}</div>` : ''}</div>` : ''}
        <div class="row-between mt-16" style="gap:8px;flex-wrap:wrap">
          <span class="tiny muted">${state.phrases[p.id] ? `已见 ${state.phrases[p.id].seen} 次` : '还没有学习记录'}</span>
          <div class="row">
            <button class="btn btn-sm btn-ghost" data-action="phrase-make-due" data-id="${p.id}">加入复习</button>
            <button class="btn btn-sm btn-soft" data-route="phrases" data-action="close-modal">去卡片学习</button>
          </div>
        </div>
      </div>
    </div>`;
  }

  function closeModal() {
    modalRoot.innerHTML = '';
  }

  function bindStudyKeys(kind) {
    // keyboard is handled by the global keydown handler; kept as a hook for future modes
  }


  /* ---------------- quiz ---------------- */

  const QUIZ_SCOPES = [
    { key: 'today_words', label: '今日单词', desc: '新词 + 今日复习' },
    { key: 'review_words', label: '待复习', desc: '按遗忘曲线到期' },
    { key: 'today_phrases', label: '今日词组', desc: '固定搭配巩固' },
    { key: 'terms', label: '文化术语', desc: '中译英选择题' },
    { key: 'wrong', label: '错题重练', desc: '只练错过的内容' },
    { key: 'all_words', label: '随机单词', desc: '从全部词库抽取' }
  ];

  function quizScopeItems(scope) {
    const d = getDaily();
    let ids = [];
    if (scope === 'today_words') ids = uniq([...d.w, ...d.r]).map(id => ({ type: 'word', id }));
    else if (scope === 'review_words') ids = dueWordIds().map(w => ({ type: 'word', id: w.id }));
    else if (scope === 'today_phrases') ids = d.p.map(id => ({ type: 'phrase', id }));
    else if (scope === 'terms') ids = TERMS.map(t => ({ type: 'term', id: t.id }));
    else if (scope === 'wrong') {
      ids = wrongList(false)
        .filter(w => ['word', 'phrase', 'term'].includes(w.type))
        .map(w => ({ type: w.type, id: Number(w.refId) }));
    } else if (scope === 'all_words') ids = WORDS.map(w => ({ type: 'word', id: w.id }));
    const seen = new Set();
    return ids.filter(x => {
      const k = x.type + ':' + x.id;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    });
  }

  function scopeItemLabel(item) {
    if (item.type === 'word') {
      const w = WORD_BY_ID.get(item.id);
      return w ? `${w.w} · ${w.m}` : '单词';
    }
    if (item.type === 'phrase') {
      const p = PHRASE_BY_ID.get(item.id);
      return p ? `${p.p} · ${p.m}` : '词组';
    }
    const t = TERM_BY_ID.get(item.id);
    return t ? `${t.zh} · ${t.en}` : '术语';
  }

  function distractorPool(type) {
    if (type === 'word') return WORDS.map(x => ({ id: x.id, text: x.m, word: x.w }));
    if (type === 'phrase') return PHRASES.map(x => ({ id: x.id, text: x.m, word: x.p }));
    return TERMS.map(x => ({ id: x.id, text: x.en, word: x.zh }));
  }

  function makeOptions(correctText, pool, excludeIds = [], n = 4) {
    const seenText = new Set([correctText.trim()]);
    const candidates = shuffle(pool.filter(x => !excludeIds.includes(x.id) && !seenText.has(String(x.text).trim())));
    const out = [];
    for (const c of candidates) {
      if (out.length >= n - 1) break;
      const t = String(c.text).trim();
      if (seenText.has(t)) continue;
      seenText.add(t);
      out.push(t);
    }
    const fallback = ['以上都不是', '暂未收录', '请选择最接近的一项'];
    let fi = 0;
    while (out.length < n - 1) out.push(fallback[fi++ % fallback.length]);
    const all = shuffle([correctText, ...out]);
    return { options: all, answer: all.indexOf(correctText) };
  }

  function makeQuestion(item, requestedType) {
    if (item.type === 'term') {
      const t = TERM_BY_ID.get(item.id);
      if (!t) return null;
      const { options, answer } = makeOptions(t.en, distractorPool('term'), [t.id]);
      return {
        type: 'term', id: t.id, mode: 'term-en', kindLabel: '文化术语 · 中译英',
        prompt: t.zh, promptClass: 'cn', hint: '选择最恰当的英文表达',
        options, answer, correctText: t.en, your: '', answered: false, correct: false,
        tag: '文化术语', refPrompt: t.zh
      };
    }
    if (item.type === 'phrase') {
      const p = PHRASE_BY_ID.get(item.id);
      if (!p) return null;
      let mode = requestedType === 'mixed' ? (Math.random() < 0.5 ? 'meaning' : 'reverse') : requestedType;
      if (mode === 'spelling') mode = 'meaning';
      if (mode === 'meaning') {
        const { options, answer } = makeOptions(p.m, distractorPool('phrase'), [p.id]);
        return {
          type: 'phrase', id: p.id, mode, kindLabel: '词组 · 看英文选中文',
          prompt: p.p, promptClass: '', hint: '选择最接近的释义',
          options, answer, correctText: p.m, your: '', answered: false, correct: false,
          tag: '固定搭配', refPrompt: p.p
        };
      }
      const { options, answer } = makeOptions(p.p, distractorPool('phrase').map(x => ({ ...x, text: x.word })), [p.id]);
      return {
        type: 'phrase', id: p.id, mode: 'reverse', kindLabel: '词组 · 看中文选英文',
        prompt: p.m, promptClass: 'cn', hint: '选择正确的固定搭配',
        options, answer, correctText: p.p, your: '', answered: false, correct: false,
        tag: '固定搭配', refPrompt: p.p
      };
    }
    const w = WORD_BY_ID.get(item.id);
    if (!w) return null;
    let mode = requestedType === 'mixed'
      ? (Math.random() < 0.48 ? 'meaning' : Math.random() < 0.72 ? 'reverse' : 'spelling')
      : requestedType;
    if (mode === 'meaning') {
      const { options, answer } = makeOptions(w.m, distractorPool('word'), [w.id]);
      return {
        type: 'word', id: w.id, mode, kindLabel: '单词 · 看英文选中文',
        prompt: w.w, promptClass: '', hint: w.p || '选择最接近的释义',
        options, answer, correctText: w.m, your: '', answered: false, correct: false,
        tag: '词义辨析', refPrompt: w.w
      };
    }
    if (mode === 'reverse') {
      const { options, answer } = makeOptions(w.w, distractorPool('word').map(x => ({ ...x, text: x.word })), [w.id]);
      return {
        type: 'word', id: w.id, mode, kindLabel: '单词 · 看中文选英文',
        prompt: w.m, promptClass: 'cn', hint: '选择对应的英文单词',
        options, answer, correctText: w.w, your: '', answered: false, correct: false,
        tag: '词义辨析', refPrompt: w.w
      };
    }
    return {
      type: 'word', id: w.id, mode: 'spelling', kindLabel: '单词 · 拼写',
      prompt: w.m, promptClass: 'cn', hint: `首字母 ${w.w[0].toUpperCase()} · 共 ${w.w.replace(/[^a-z]/gi, '').length} 个字母`,
      options: [], answer: -1, correctText: w.w, your: '', answered: false, correct: false,
      tag: '拼写错误', refPrompt: w.w, spelling: true
    };
  }

  function startQuiz(scope, type, count) {
    const all = quizScopeItems(scope);
    if (!all.length) {
      toast(scope === 'wrong' ? '错题本里还没有可重练的题目' : '这个范围暂时没有题目，先去学几个词吧');
      return;
    }
    const n = Math.min(count > 0 ? count : all.length, all.length);
    const chosen = shuffle(all).slice(0, n);
    const questions = chosen.map(item => makeQuestion(item, type)).filter(Boolean);
    if (!questions.length) { toast('题目生成失败，请重试'); return; }
    ui.quiz = {
      scope, type, questions, idx: 0, score: 0, answered: false,
      total: questions.length, startAt: Date.now(), finished: false
    };
    ui.quizAnswered = false;
    ui.quizInput = '';
    navigate('quiz');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderQuizPage() {
    if (ui.quiz) {
      return ui.quiz.finished ? renderQuizResult() : renderQuizQuestion();
    }
    const scopes = QUIZ_SCOPES.map(s => {
      const n = quizScopeItems(s.key).length;
      return `<button class="scope-card ${ui.quizConfig.scope === s.key ? 'active' : ''}" data-action="quiz-scope" data-scope="${s.key}">
        <b>${s.label}</b><span>${s.desc} · ${n} 题</span>
      </button>`;
    }).join('');
    return `${pageHead('quiz', `<button class="pill-btn" data-route="notebook">${icon('notebook')}<span>错题本</span></button>`)}
      <div class="quiz-start">
        <div class="quiz-hero">
          <div class="page-eyebrow">Quick Check</div>
          <h2>来一组，看看记住了多少</h2>
          <p>选择题即时反馈，拼写题按 Enter 提交。答错会自动进入错题本，并按遗忘曲线安排复习。</p>
          <div class="scope-grid">${scopes}</div>
        </div>
        <div class="quiz-config">
          <div class="config-box">
            <h4>题型</h4>
            <div class="chip-row">
              <button class="chip ${ui.quizConfig.type === 'mixed' ? 'active' : ''}" data-action="quiz-type" data-type="mixed">混合</button>
              <button class="chip ${ui.quizConfig.type === 'meaning' ? 'active' : ''}" data-action="quiz-type" data-type="meaning">英译中</button>
              <button class="chip ${ui.quizConfig.type === 'reverse' ? 'active' : ''}" data-action="quiz-type" data-type="reverse">中译英</button>
              <button class="chip ${ui.quizConfig.type === 'spelling' ? 'active' : ''}" data-action="quiz-type" data-type="spelling">拼写</button>
            </div>
          </div>
          <div class="config-box">
            <h4>题量</h4>
            <div class="chip-row">
              ${[10, 20, 30, 50].map(n => `<button class="chip ${ui.quizConfig.count === n ? 'active' : ''}" data-action="quiz-count" data-count="${n}">${n} 题</button>`).join('')}
              <button class="chip ${ui.quizConfig.count === 999 ? 'active' : ''}" data-action="quiz-count" data-count="999">全部</button>
            </div>
          </div>
        </div>
        <div class="center mt-24">
          <button class="btn btn-primary btn-lg" data-action="start-quiz">${icon('play')}开始测试</button>
          <p class="tiny muted mt-8">范围：${QUIZ_SCOPES.find(s => s.key === ui.quizConfig.scope)?.label || ''} · 题型：${({mixed:'混合',meaning:'英译中',reverse:'中译英',spelling:'拼写'})[ui.quizConfig.type]}</p>
        </div>
      </div>`;
  }

  function renderQuizQuestion() {
    const q = ui.quiz.questions[ui.quiz.idx];
    if (!q) return renderQuizResult();
    const progress = pct(ui.quiz.idx, ui.quiz.total);
    const letters = ['A', 'B', 'C', 'D'];
    const optionHtml = q.spelling ? `
      <form class="mt-16" id="spell-form">
        <input class="spell-input" id="quiz-spell" type="text" spellcheck="false" autocomplete="off" placeholder="输入英文单词…" value="${esc(ui.quizInput)}" ${q.answered ? 'disabled' : ''}>
        <div class="row-between mt-8"><span class="tiny muted">${esc(q.hint)}</span>${!q.answered ? `<button class="btn btn-primary btn-sm" type="submit">提交</button>` : ''}</div>
      </form>` : `
      <div class="options">
        ${q.options.map((o, i) => {
          let cls = 'option';
          if (q.answered) {
            if (i === q.answer) cls += ' correct';
            else if (i === q.chosen) cls += ' wrong';
            else cls += ' dim';
          }
          return `<button class="${cls}" data-action="quiz-answer" data-index="${i}" ${q.answered ? 'disabled' : ''}>
            <span class="key">${letters[i]}</span><span class="txt">${esc(o)}</span>
          </button>`;
        }).join('')}
      </div>`;
    return `${pageHead('quiz', `<button class="pill-btn" data-action="quiz-exit">${icon('x')}<span>退出</span></button>`)}
      <div class="quiz-head">
        <div class="quiz-progress">
          <div class="row-between"><span>${ui.quiz.scope === 'wrong' ? '错题重练' : '测试进行中'}</span><span>${ui.quiz.idx + 1} / ${ui.quiz.total}</span></div>
          <div class="progress"><i style="width:${progress}%"></i></div>
        </div>
        <span class="tag tag-teal">得分 ${ui.quiz.score}</span>
      </div>
      <article class="card quiz-card">
        <div class="row-between"><div class="q-kind">${q.kindLabel}</div><span class="tag">${q.type === 'word' ? '核心词' : q.type === 'phrase' ? '词组' : '文化术语'}</span></div>
        <h2 class="q-prompt ${q.promptClass || ''}">${esc(q.prompt)}</h2>
        <div class="q-hint">${esc(q.hint)}</div>
        ${optionHtml}
        ${q.answered ? `
          <div class="feedback ${q.correct ? 'ok' : 'no'}">
            <b>${q.correct ? '答对了' : '答错了'}</b>
            ${q.correct ? '' : `<span class="ans-en">正确答案：${esc(q.correctText)}</span>`}
            ${!q.correct && q.your ? `<span class="tiny">你的答案：${esc(q.your)}</span>` : ''}
          </div>
          <div class="quiz-actions">
            <button class="btn btn-primary" data-action="quiz-next">${ui.quiz.idx + 1 >= ui.quiz.total ? '查看结果' : '下一题'} ${icon('arrow-right')}</button>
          </div>` : ''}
      </article>`;
  }

  function renderQuizResult() {
    const qz = ui.quiz;
    const total = qz.total;
    const score = qz.score;
    const acc = pct(score, total);
    const wrong = total - score;
    let title = '继续积累，手感会越来越稳';
    if (acc >= 90) title = '很稳，这一组掌握得不错';
    else if (acc >= 70) title = '基础不错，把错题再过一遍';
    else if (acc >= 50) title = '记住了一半，错题值得重练';
    return `${pageHead('quiz', `<button class="pill-btn" data-action="quiz-exit">${icon('x')}<span>结束</span></button>`)}
      <div class="result-card card">
        <div class="score-ring" style="--score:${acc}"><div><b>${acc}<span style="font-size:15px">%</span></b><span>正确率</span></div></div>
        <h2 class="result-title">${title}</h2>
        <p class="result-sub">本组 ${total} 题，答对 ${score} 题，答错 ${wrong} 题。</p>
        <div class="result-grid">
          <div class="result-mini"><b>${score}</b><span>答对</span></div>
          <div class="result-mini"><b>${wrong}</b><span>答错</span></div>
          <div class="result-mini"><b>${Math.round((Date.now() - qz.startAt) / 60000)}</b><span>用时（分钟）</span></div>
        </div>
        <div class="finish-actions">
          <button class="btn btn-primary" data-action="quiz-retry">${icon('refresh')}再练一组</button>
          <button class="btn btn-ghost" data-action="quiz-exit">${icon('arrow-left')}返回测试首页</button>
          ${wrong ? `<button class="btn btn-ghost" data-route="notebook">${icon('notebook')}查看错题</button>` : ''}
        </div>
        ${wrong ? `<p class="tiny muted mt-16">答错的题已经自动加入错题本，之后会优先出现在待复习队列里。</p>` : ''}
      </div>`;
  }

  function answerQuiz(index) {
    const qz = ui.quiz;
    if (!qz || qz.finished) return;
    const q = qz.questions[qz.idx];
    if (!q || q.answered) return;
    let correct;
    if (q.spelling) {
      const yours = normalizeAnswer(ui.quizInput);
      correct = yours === normalizeAnswer(q.correctText);
      q.your = ui.quizInput.trim();
    } else {
      q.chosen = Number(index);
      q.your = q.options[index] || '';
      correct = Number(index) === q.answer;
    }
    q.answered = true;
    q.correct = correct;
    qz.answered = true;
    if (correct) qz.score++;
    bumpStat('quizzes');
    if (q.type === 'word') reviewWord(q.id, correct ? 2 : 0);
    if (q.type === 'phrase') reviewPhrase(q.id, correct ? 2 : 0);
    if (q.type === 'term') reviewTerm(q.id, correct);
    if (correct) {
      const key = wrongKey(q.type, q.id);
      if (state.wrong[key]) markWrongRight(key);
    } else {
      addWrong({
        type: q.type, refId: q.id, prompt: q.refPrompt || q.prompt,
        correct: q.correctText, your: q.your || '（未作答）', tag: q.tag
      });
    }
    save();
    render();
  }

  function nextQuiz() {
    const qz = ui.quiz;
    if (!qz) return;
    if (qz.idx + 1 >= qz.total) {
      qz.finished = true;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    qz.idx++;
    ui.quizInput = '';
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  /* ---------------- translation ---------------- */

  function sentenceQueue() {
    const d = getDaily();
    return d.s.map(id => SENTENCE_BY_ID.get(id)).filter(Boolean);
  }

  function currentSentence() {
    const d = getDaily();
    const id = d.s.find(x => !d.done.s.includes(x));
    return id != null ? SENTENCE_BY_ID.get(id) : null;
  }

          <div class="row small muted"><span>${TERMS.length} 个文化术语</span><span>·</span><span>${SENTENCES.length} 句短句</span><span>·</span><span>${EXAMS.length} 篇真题翻译</span></div>

        ${body}
      </div>`;

    const d = getDaily();

      return `<div class="finish-card card">

            <div class="row-between mt-12 wrap">

                <button class="btn btn-ghost btn-sm" data-action="sentence-skip">先跳过</button>
                <button class="btn btn-primary" data-action="sentence-reveal">${icon('eye')}对照参考译文</button>
              </div>
            </div>` : `
            <div class="ref-box">
              <h4>Reference · 参考译文</h4>
              <div class="ref-en">${esc(s.en)}</div>
              ${s.terms.length ? `<div class="key-hits">${keyHits}</div>
              <div class="tiny" style="color:var(--green);margin-top:8px">关键表达命中 ${s.terms.filter(t => termHit(ui.sentenceDraft, t)).length} / ${s.terms.length}。对照一下，哪些词你用了别的说法？</div>` : `<div class="tiny" style="color:var(--green);margin-top:8px">这句没有预设关键词，重点对照语序和句子主干。</div>`}
            </div>
            <div class="rate-inline">
              <button class="btn btn-primary btn-sm" data-action="sentence-good">${icon('check')}基本掌握</button>
              <button class="btn btn-ghost btn-sm" data-action="sentence-bad">${icon('refresh')}还要再练</button>
            </div>`}
        </div>
        <div class="card card-pad">

          <div class="similar-mini">${(e.terms || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>

          <div class="row wrap">
            ${EXAMS.slice(Math.max(0, idx - 1), idx + 3).map(x => `<button class="chip" data-action="exam-open" data-id="${x.id}">${esc(x.topic)}</button>`).join('')}

  /* ---------------- 导入词库 ---------------- */

  const POS_SET = /^(n|v|vt|vi|adj|adv|prep|conj|pron|art|num|int|aux|a)\.?$/i;
  const CJK_RE = /[\u3400-\u9fff]/;
  const hasCJK = s => CJK_RE.test(String(s || ''));

  function cleanEn(s) {
    return String(s || '')
      .replace(/\u00a0/g, ' ')
      .replace(/\s+/g, ' ')
      .replace(/[，,；;、:：\-–—\s]+$/, '')
      .replace(/^[·•\-\s]+/, '')
      .trim();
  }

  function cleanZh(s) {
    return String(s || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').replace(/^[:：\-–—\s]+/, '').trim();
  }

  function stripNumbering(line) {
    return String(line)
      .replace(/^\s*[（(]?\d+[)）]?\s*[.、:：．)]\s*/, '')
      .replace(/^\s*[-*•·]\s*/, '')
      .trim();
  }

  function finalizePair(en, zh) {
    let e = cleanEn(en);
    let z = cleanZh(zh);
    if (!e || !z) return null;
    if (!/[A-Za-z]/.test(e) || !hasCJK(z)) return null;
    if (e.replace(/[^A-Za-z]/g, '').length < 2 || !/[aeiouy]/i.test(e)) return null;
    // 把 "abandon vt." 拆成 abandon + vt.
    const m = e.match(/^(.*\S)\s+((?:n|v|vt|vi|adj|adv|prep|conj|pron|art|num|int|aux|a)\b\.?)\s*$/i);
    if (m && m[1] && !POS_SET.test(m[1])) {
      const pos = m[2].endsWith('.') ? m[2] : m[2] + '.';
      e = m[1];
      if (!z.startsWith(pos)) z = pos + z;
    }
    e = cleanEn(e);
    if (!e) return null;
    return { en: e, zh: z };
  }

  function pairFromColumns(cols) {
    const parts = cols.map(x => String(x).trim()).filter(Boolean);
    if (parts.length < 2) return null;
    if (parts.length === 2) {
      const [a, b] = parts;
      const aIsZh = hasCJK(a), bIsZh = hasCJK(b);
      if (aIsZh && !bIsZh) return finalizePair(b, a);
      if (!aIsZh && bIsZh) return finalizePair(a, b);
      return finalizePair(a, b);
    }
    const zh = parts.find(p => hasCJK(p)) || '';
    const en = parts.find(p => /[A-Za-z]/.test(p) && !hasCJK(p)) || '';
    const pos = parts.find(p => POS_SET.test(p)) || '';
    if (!zh || !en) return null;
    const out = finalizePair(en, zh);
    if (out && pos) {
      const withPos = pos.endsWith('.') ? pos : pos + '.';
      if (!out.zh.startsWith(withPos)) out.zh = withPos + out.zh;
    }
    return out;
  }

  function parseLine(line) {
    let s = String(line).replace(/\u00a0/g, ' ').replace(/\t+$/, '').trim();
    if (!s) return null;
    if (/^(#|\/\/|\|)/.test(s)) return null;
    s = stripNumbering(s);
    if (!s) return null;
    if (s.includes('\t')) {
      const cols = s.split('\t').map(x => x.trim()).filter(x => x !== '');
      const out = pairFromColumns(cols);
      if (out) return out;
    }
    for (const sep of [' || ', '||', ' | ', '|', ' :: ', '::', ' = ', '=', ' —— ', '——', ' — ', '—', ' - ', '／', '/']) {
      if (!s.includes(sep)) continue;
      const i = s.indexOf(sep);
      if (i <= 0) continue;
      const a = s.slice(0, i).trim();
      const b = s.slice(i + sep.length).trim();
      if (!a || !b) continue;
      const out = pairFromColumns([a, b]);
      if (out) return out;
    }
    const m = s.match(CJK_RE);
    if (m && m.index > 0) {
      const out = finalizePair(s.slice(0, m.index), s.slice(m.index));
      if (out) return out;
    }
    if (m && m.index === 0) {
      // 中文在前，英文在后
      const rest = s.slice(0);
      const enMatch = rest.match(/[A-Za-z][A-Za-z'’\- .]*[A-Za-z.]/);
      if (enMatch) {
        const en = enMatch[0].trim();
        const zh = cleanZh(rest.slice(0, enMatch.index) + ' ' + rest.slice(enMatch.index + en.length));
        const out = finalizePair(en, zh);
        if (out) return out;
      }
    }
    for (const sep of ['：', ':', '；']) {
      const i = s.indexOf(sep);
      if (i <= 0) continue;
      const out = pairFromColumns([s.slice(0, i).trim(), s.slice(i + sep.length).trim()]);
      if (out) return out;
    }
    return null;
  }

  function normalizeRows(raw) {
    const out = { words: [], phrases: [], sentences: [], errors: [] };
    for (const item of raw) {
      if (item.kind === 'word' || item.kind === 'phrase') {
        const target = item.kind === 'word' ? out.words : out.phrases;
        target.push(item.kind === 'word'
          ? { w: item.en, p: '', m: item.zh }
          : { p: item.en, m: item.zh });
      } else {
        out.sentences.push(item);
      }
    }
    return out;
  }

  function parseImportText(text, target) {
    const rows = [];
    const errors = [];
    let skipped = 0;
    const src = String(text || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
    if (!src.trim()) return { rows, errors, skipped, format: 'empty' };

    let format = 'list';
    const first = src.trim()[0];
    if (first === '[' || first === '{') {
      try {
        const parsed = JSON.parse(src);
        format = 'json';
        const pushPair = (en, zh, kind) => {
          const p = finalizePair(en, zh);
          if (!p) { skipped++; return; }
          rows.push({ kind, en: p.en, zh: p.zh });
        };
        const arrays = [];
        if (Array.isArray(parsed)) arrays.push(['auto', parsed]);
        else {
          if (Array.isArray(parsed.words)) arrays.push(['word', parsed.words]);
          if (Array.isArray(parsed.phrases)) arrays.push(['phrase', parsed.phrases]);
          if (Array.isArray(parsed.sentences)) arrays.push(['sentence', parsed.sentences]);
          if (!arrays.length) arrays.push(['auto', [parsed]]);
        }
        for (const [kindHint, arr] of arrays) {
          for (const row of arr) {
            if (typeof row === 'string') {
              const p = parseLine(row);
              if (p) rows.push({ kind: kindHint === 'auto' ? guessKind(p.en, p.zh) : kindHint, en: p.en, zh: p.zh });
              else skipped++;
              continue;
            }
            if (Array.isArray(row)) {
              const p = pairFromColumns(row.map(String));
              if (p) rows.push({ kind: kindHint === 'auto' ? guessKind(p.en, p.zh) : kindHint, en: p.en, zh: p.zh });
              else skipped++;
              continue;
            }
            if (row && typeof row === 'object') {
              const en = row.en || row.english || row.word || row.p || row.w || row.phrase || '';
              const zh = row.zh || row.cn || row.chinese || row.m || row.meaning || '';
              if (kindHint === 'sentence' || row.zh && row.en && (String(row.en).split(/\s+/).length > 5)) {
                const z = cleanZh(zh), e = cleanEn(en);
                if (z && e) rows.push({ kind: 'sentence', zh: z, en: e, topic: row.topic || row.title || z.slice(0, 8), terms: Array.isArray(row.terms) ? row.terms : [] });
                else skipped++;
              } else {
                const p = finalizePair(en, zh);
                if (p) rows.push({ kind: kindHint === 'auto' ? guessKind(p.en, p.zh) : kindHint, en: p.en, zh: p.zh });
                else skipped++;
              }
            }
          }
        }
        return { rows, errors, skipped, format };
      } catch (err) {
        return { rows: [], errors: [{ line: src.slice(0, 40), reason: 'JSON 解析失败，请检查格式' }], skipped: 0, format: 'json' };
      }
    }

    const lines = src.split('\n');
    const targetKind = target === 'word' || target === 'phrase' || target === 'sentence' ? target : 'auto';
    lines.forEach((line, i) => {
      const raw = line.trim();
      if (!raw) return;
      const pair = parseLine(raw);
      if (!pair) {
        if (/[A-Za-z\u3400-\u9fff]/.test(raw)) {
          skipped++;
          if (errors.length < 12) errors.push({ line: raw.slice(0, 48), reason: raw.length > 60 ? '这一行太长，可能是段落而不是词条' : '没有找到释义（需要中英文都在同一行）' });
        }
        return;
      }
      const kind = targetKind === 'auto' ? guessKind(pair.en, pair.zh) : targetKind;
      rows.push({ kind, en: pair.en, zh: pair.zh });
    });
    return { rows, errors, skipped, format };
  }

  function guessKind(en, zh) {
    const words = String(en).split(/\s+/).filter(Boolean);
    if (words.length >= 6 || (words.length >= 4 && String(zh).length >= 22)) return 'sentence';
    if (words.length >= 2) return 'phrase';
    return 'word';
  }

  function handleImportText(text, name) {
    const parsed = parseImportText(text, ui.importTarget);
    if (!parsed.rows.length) {
      ui.importPhase = 'error';
      ui.importRows = [];
      ui.importErrors = parsed.errors.length ? parsed.errors : [{ line: '', reason: '没有解析出可用的词条。请检查每行是否同时包含英文和中文释义。' }];
      ui.importName = name || '粘贴的文本';
      render();
      toast('没有解析到词条，看看右侧的格式说明');
      return;
    }
    ui.importPhase = 'preview';
    ui.importRows = parsed.rows;
    ui.importErrors = parsed.errors;
    ui.importKept = parsed.skipped;
    ui.importName = name || '粘贴的文本';
    render();
  }

  function readImportFile(file) {
    if (!file) return;
    ui.importText = '';
    const fr = new FileReader();
    fr.onload = () => {
      const text = String(fr.result || '');
      if (!/\uFFFD/.test(text)) {
        handleImportText(text, file.name);
        return;
      }
      // 可能是 GBK 编码的 txt，换一种解码再试
      try {
        const fr2 = new FileReader();
        fr2.onload = () => {
          let out = text;
          try {
            const Decoder = window.TextDecoder || TextDecoder;
            out = new Decoder('gbk').decode(new Uint8Array(fr2.result));
          } catch (err) { /* 保留 UTF-8 结果 */ }
          handleImportText(out, file.name);
        };
        fr2.readAsArrayBuffer(file);
      } catch (err) {
        handleImportText(text, file.name);
      }
    };
    fr.onerror = () => toast('文件读取失败，可以直接把内容粘贴到下面的框里');
    fr.readAsText(file);
  }

  function topicFromZh(zh) {
    const s = String(zh || '').replace(/^[\s"'“”《（(]+/, '').trim();
    if (!s) return '导入的翻译';
    const first = s.split(/[，。；、：,.;:!?！？]/)[0] || s;
    const base = first.length >= 4 ? first : s;
    return base.length > 14 ? base.slice(0, 14) : base;
  }

  function dedupeImport(rows) {
    const seenW = new Set(WORDS.map(w => String(w.w).toLowerCase()));
    const seenP = new Set(PHRASES.map(p => String(p.p).toLowerCase()));
    const seenS = new Set(SENTENCES.map(s => String(s.zh)));
    const kept = { words: [], phrases: [], sentences: [] };
    let dup = 0, invalid = 0;
    for (const r of rows) {
      if (r.kind === 'word') {
        const key = String(r.en).toLowerCase();
        if (!r.en || !r.zh) { invalid++; continue; }
        if (String(r.en).split(/\s+/).length > 8) { invalid++; continue; }
        if (seenW.has(key)) { dup++; continue; }
        seenW.add(key);
        kept.words.push({ w: r.en, p: '', m: r.zh });
      } else if (r.kind === 'phrase') {
        const key = String(r.en).toLowerCase();
        if (!r.en || !r.zh) { invalid++; continue; }
        if (String(r.en).split(/\s+/).length > 10) { invalid++; continue; }
        if (seenP.has(key)) { dup++; continue; }
        seenP.add(key);
        kept.phrases.push({ p: r.en, m: r.zh });
      } else {
        if (!r.en || !r.zh) { invalid++; continue; }
        if (seenS.has(r.zh)) { dup++; continue; }
        seenS.add(r.zh);
        kept.sentences.push({ topic: r.topic || topicFromZh(r.zh), zh: r.zh, en: r.en, terms: Array.isArray(r.terms) ? r.terms : [] });
      }
    }
    return { kept, dup, invalid };
  }

  function commitImport() {
    const rows = ui.importRows || [];
    if (!rows.length) { toast('还没有可导入的内容'); return; }
    const { kept, dup, invalid } = dedupeImport(rows);
    const total = kept.words.length + kept.phrases.length + kept.sentences.length;
    if (!total) {
      toast(dup ? `这 ${dup} 条都已经在词库里了` : '没有有效词条');
      return;
    }
    const c = customDeck();
    const batchId = 'b' + Date.now().toString(36);
    const batch = {
      id: batchId,
      name: ui.importName || '导入 ' + new Date().toLocaleDateString('zh-CN'),
      at: Date.now(),
      w: 0, p: 0, s: 0,
      dup, invalid
    };
    const newWordIds = [], newPhraseIds = [], newSentenceIds = [];
    for (const w of kept.words) {
      const id = c.seq++;
      const item = { id, w: w.w, p: w.p, m: w.m, src: 'import', batch: batchId };
      c.words.push(item);
      newWordIds.push(id);
      batch.w++;
    }
    for (const p of kept.phrases) {
      const id = c.seq++;
      const item = { id, p: p.p, m: p.m, src: 'import', batch: batchId };
      c.phrases.push(item);
      newPhraseIds.push(id);
      batch.p++;
    }
    for (const s of kept.sentences) {
      const id = c.seq++;
      const item = { id, topic: s.topic, zh: s.zh, en: s.en, terms: s.terms, src: 'import', batch: batchId };
      c.sentences.push(item);
      newSentenceIds.push(id);
      batch.s++;
    }
    c.batches.push(batch);
    state.custom = c;
    rebuildPools();
    addNewToToday(newWordIds, newPhraseIds, newSentenceIds);
    save();
    ui.importPhase = 'done';
    ui.importRows = [];
    ui.importErrors = [];
    ui.importText = '';
    render();
    toast(`已导入 ${total} 条${dup ? `，跳过 ${dup} 条重复` : ''}`);
  }

  function addNewToToday(wordIds, phraseIds, sentenceIds) {
    const d = getDaily();
    for (const id of wordIds) {
      if (!d.w.includes(id) && !d.done.w.includes(id)) d.w.push(id);
    }
    for (const id of phraseIds) {
      if (!d.p.includes(id) && !d.done.p.includes(id)) d.p.push(id);
    }
    const room = Math.max(0, (state.settings.dailyTranslations || 0) - d.s.length);
    for (const id of sentenceIds.slice(0, Math.max(room, 1))) {
      if (d.s.includes(id)) continue;
      if (d.s.length < (state.settings.dailyTranslations || 0)) { d.s.push(id); continue; }
      // 今日计划已排满：替换掉最后一句还没做的，保证导入后马上能练到
      const idle = [...d.s].reverse().find(x => !d.done.s.includes(x));
      if (idle != null) d.s[d.s.indexOf(idle)] = id;
      else d.s.push(id);
    }
    save();
  }

  function pruneDaily() {
    const wSet = new Set(WORDS.map(w => w.id));
    const pSet = new Set(PHRASES.map(p => p.id));
    const sSet = new Set(SENTENCES.map(s => s.id));
    const d = getDaily();
    const keep = { w: wSet, r: wSet, p: pSet, s: sSet };
    for (const k of ['w', 'r', 'p', 's']) {
      d[k] = d[k].filter(id => keep[k].has(id));
      d.done[k] = d.done[k].filter(id => keep[k].has(id));
    }
    save();
  }

  function deleteBatch(batchId) {
    const c = customDeck();
    const batch = c.batches.find(b => b.id === batchId);
    if (!batch) return;
    if (!confirm(`删除导入的「${batch.name}」？这一批的 ${batch.w + batch.p + batch.s} 条词条会一起移除（学习记录会保留）。`)) return;
    c.words = c.words.filter(x => x.batch !== batchId);
    c.phrases = c.phrases.filter(x => x.batch !== batchId);
    c.sentences = c.sentences.filter(x => x.batch !== batchId);
    c.batches = c.batches.filter(b => b.id !== batchId);
    state.custom = c;
    rebuildPools();
    pruneDaily();
    render();
    toast('已删除这一批导入内容');
  }

  function clearImports() {
    const c = customDeck();
    const n = c.words.length + c.phrases.length + c.sentences.length;
    if (!n) { toast('还没有导入过内容'); return; }
    if (!confirm(`清空全部 ${n} 条导入内容？（内置词库和学习记录不受影响）`)) return;
    state.custom = defaultState().custom;
    rebuildPools();
    pruneDaily();
    render();
    toast('已清空导入内容');
  }

  function exportImports() {
    const c = customDeck();
    if (!c.words.length && !c.phrases.length && !c.sentences.length) { toast('还没有导入过内容'); return; }
    const payload = {
      app: 'wordway-cet4-deck', version: 1, exportedAt: new Date().toISOString(),
      words: c.words.map(x => ({ w: x.w, m: x.m })),
      phrases: c.phrases.map(x => ({ p: x.p, m: x.m })),

    };
    download(`词途CET4-我的词库-${todayKey()}.json`, JSON.stringify(payload, null, 2));
    toast('已导出导入的词库');
  }

    const samples = {

      sentence: `# 翻译模板：每行 中文<Tab>英文（两列，顺序可颠倒）\n剪纸是中国民间艺术的一种独特形式。\tPaper cutting is a unique form of Chinese folk art.\n`

  /* ---------------- notebook ---------------- */

  const TYPE_LABEL = { word: '单词', phrase: '词组', term: '术语', sentence: '翻译' };
  const TAG_COLORS = ['var(--accent)', 'var(--primary)', 'var(--blue)', 'var(--gold)', 'var(--red)'];

  function renderNotebookPage() {
    const all = wrongList(false);
    const mastered = wrongList(true).filter(w => w.mastered);
    const tags = {};
    all.forEach(w => { tags[w.tag || '待归类'] = (tags[w.tag || '待归类'] || 0) + 1; });
    const sortedTags = Object.entries(tags).sort((a, b) => b[1] - a[1]);
    const topTag = sortedTags[0]?.[0] || '暂无';
    const repeated = all.filter(w => w.count >= 2).length;
    const filter = ui.notebookFilter;
    const list = wrongList(true).filter(w => filter === 'all' || w.type === filter);
    const typeCounts = { word: 0, phrase: 0, term: 0, sentence: 0 };
    all.forEach(w => { typeCounts[w.type] = (typeCounts[w.type] || 0) + 1; });
    const bars = sortedTags.slice(0, 6).map(([tag, n], i) => `
      <div class="tag-bar">
        <div class="tag-bar-head"><b>${esc(tag)}</b><span>${n} 题 · ${pct(n, all.length || 1)}%</span></div>
        <div class="tag-bar" style="height:8px"><i style="width:${pct(n, all.length || 1)}%;background:${TAG_COLORS[i % TAG_COLORS.length]}"></i></div>
      </div>`).join('');
    const suggestion = getErrorSuggestion(sortedTags);
    return `${pageHead('notebook', `<button class="pill-btn" data-action="practice-wrong">${icon('refresh')}<span>重练错题</span></button>`)}
      <div class="analysis-grid">
        <div class="card analysis-tile"><b>${all.length}</b><span>待攻克错题</span><span class="tag tag-red">未掌握</span></div>
        <div class="card analysis-tile"><b>${repeated}</b><span>重复出错</span><span class="tag tag-gold">需要重点看</span></div>
        <div class="card analysis-tile"><b>${mastered.length}</b><span>已经攻克</span><span class="tag tag-green">连续答对 2 次</span></div>
        <div class="card analysis-tile"><b style="font-size:19px;line-height:1.4;margin-top:4px">${esc(topTag)}</b><span>主要薄弱点</span><span class="tag tag-teal">错误类型</span></div>
      </div>
      <div class="analysis-main">
        <section class="card card-pad">
          <div class="filter-bar">
            <div class="seg">
              ${['all', 'word', 'phrase', 'term', 'sentence'].map(f => `<button class="${filter === f ? 'active' : ''}" data-action="notebook-filter" data-filter="${f}">${f === 'all' ? '全部' : TYPE_LABEL[f]}${f !== 'all' ? ` ${typeCounts[f] || 0}` : ` ${wrongList(true).length}`}</button>`).join('')}
            </div>
            <span class="count-note" style="margin-left:auto">${list.length} 条</span>
          </div>
          <div class="wrong-list">
            ${list.length ? list.map(wrongCard).join('') : `<div class="empty"><div class="empty-icon">${icon('check')}</div><h4>这一类还没有错题</h4><p>继续保持，或者去测试里挑战一下。</p></div>`}
          </div>
        </section>
        <aside class="stack">
          <div class="card card-pad">
            <div class="card-head"><div><h3 class="card-title">错题分析</h3><div class="card-sub">按错误类型统计</div></div><span class="tag">${all.length} 题</span></div>
            ${bars || `<p class="small muted">还没有足够的数据，先做几组测试吧。</p>`}
            <div class="insight mt-16"><b>建议：</b>${suggestion}</div>
          </div>
          <div class="card card-pad">
            <h3 class="card-title">按题型</h3>
            <div class="progress-list mt-12">
              ${Object.entries(typeCounts).map(([t, n]) => `<div><div class="progress-row"><span>${TYPE_LABEL[t]}</span><b>${n}</b></div><div class="progress" style="height:5px"><i style="width:${pct(n, all.length || 1)}%"></i></div></div>`).join('')}
            </div>
          </div>
          <div class="card card-pad">
            <div class="row-between"><span class="tiny muted">管理</span></div>
            <div class="data-actions">
              <button class="btn btn-sm btn-ghost" data-action="clear-mastered">清空已攻克</button>
              <button class="btn btn-sm btn-ghost" data-action="export-wrong">导出错题</button>
            </div>
          </div>
        </aside>
      </div>`;
  }

  function wrongCard(w) {
    const open = ui.notebookOpen === w.key;
    const typeLabel = TYPE_LABEL[w.type] || w.type;
    const promptClass = w.type === 'sentence' || w.type === 'term' ? 'cn' : '';
    return `<article class="wrong-item ${open ? 'open' : ''} ${w.mastered ? 'mastered' : ''}">
      <div class="wrong-top" data-action="toggle-wrong" data-key="${esc(w.key)}" style="cursor:pointer">
        <div style="min-width:0">
          <div class="wrong-prompt ${promptClass}">${esc(w.prompt)}</div>
          <div class="wrong-meta">
            <span class="tag ${w.mastered ? 'tag-green' : 'tag-red'}">${w.mastered ? '已攻克' : '待复习'}</span>
            <span class="tag">${typeLabel}</span>
            <span class="tag tag-gold">${esc(w.tag || '待归类')}</span>
            <span class="tag">错 ${w.count} 次</span>
          </div>
        </div>
        <button class="icon-btn" data-action="toggle-wrong" data-key="${esc(w.key)}" aria-label="展开">${icon('chevron')}</button>
      </div>
      <div class="wrong-detail">
        <div class="wrong-answer">
          <div><b>正确答案：</b>${esc(w.correct)}</div>
          <div><s>你的答案：${esc(w.your || '（未作答）')}</s></div>
          <div class="muted tiny">首次错误 ${new Date(w.first).toLocaleDateString('zh-CN')} · 最近错误 ${new Date(w.last).toLocaleDateString('zh-CN')}</div>
        </div>
        <div class="wrong-actions">
          <button class="btn btn-sm btn-soft" data-action="master-wrong" data-key="${esc(w.key)}">${icon('check')}标记掌握</button>
          <button class="btn btn-sm btn-ghost" data-action="delete-wrong" data-key="${esc(w.key)}">${icon('trash')}删除</button>
        </div>
      </div>
    </article>`;
  }

  function getErrorSuggestion(tags) {
    const top = tags[0]?.[0] || '';
    if (!tags.length) return '先完成几组测试，错题分析会随着数据慢慢清晰。';
    if (top.includes('拼写')) return '拼写错误占比较高，建议在测试里选择“拼写”模式，每天练 10 个词，重点看元音和双写字母。';
    if (top.includes('固定搭配')) return '词组错误较多，背词组时不要只记中文，要连同介词一起读出来，并对照“易混搭配”。';
    if (top.includes('文化术语')) return '文化术语容易混，建议按“历史 / 思想 / 艺术 / 节日”分类过一遍术语卡，再做题。';
    if (top.includes('翻译')) return '翻译表达还需要打磨，先抓主干，再补充修饰；写完后对照参考译文，把差异最大的表达记下来。';
    if (top.includes('词义')) return '词义辨析是主要问题，复习时多留意形近词和一词多义，别只背第一个释义。';
    return '把重复出错的题优先重练一遍，连续答对两次后会自动标记为已攻克。';
  }

  /* ---------------- stats ---------------- */

  function renderStatsPage() {
    const total = state.stats.totals;
    const seenWord = WORDS.filter(w => state.words[w.id]?.seen).length;
    const masteredWord = WORDS.filter(w => (state.words[w.id]?.level || 0) >= 4).length;
    const seenPhrase = PHRASES.filter(p => state.phrases[p.id]?.seen).length;
    const seenTerm = Object.keys(state.terms).length;
    const doneSentence = SENTENCES.filter(s => state.sentences[s.id]?.seen).length;
    const acc = total.correct + total.wrong ? pct(total.correct, total.correct + total.wrong) : 0;
    const days = [];
    for (let i = 13; i >= 0; i--) {
      const k = addDays(todayKey(), -i);
      const s = state.stats.byDate[k] || {};
      days.push({ key: k, n: (s.words || 0) + (s.phrases || 0) + (s.sentences || 0) + (s.exams || 0) + (s.quizzes || 0) + (s.terms || 0) });
    }
    const maxN = Math.max(1, ...days.map(x => x.n));
    const bars = days.map(x => `<div class="act-col"><div class="act-bar ${x.n ? 'on' : ''}" style="height:${x.n ? Math.max(6, x.n / maxN * 100) : 3}%"><span class="val">${x.n}</span></div><span>${fmtShortDate(x.key)}</span></div>`).join('');
    const heat = [];
    for (let i = 27; i >= 0; i--) {
      const k = addDays(todayKey(), -i);
      const s = state.stats.byDate[k] || {};
      const n = (s.words || 0) + (s.phrases || 0) + (s.sentences || 0) + (s.exams || 0) + (s.quizzes || 0) + (s.terms || 0);
      const lv = n === 0 ? 0 : n < 10 ? 1 : n < 25 ? 2 : n < 50 ? 3 : 4;
      heat.push(`<div class="heat-cell l${lv}" title="${k} · ${n} 次"></div>`);
    }
    const levels = [0, 1, 2, 3, 4, 5, 6, 7].map(l => WORDS.filter(w => (state.words[w.id]?.level || 0) === l && state.words[w.id]?.seen).length);
    const maxLevel = Math.max(1, ...levels);
    const achievements = [
      { id: 'first', name: '起步', desc: '完成第一次学习', on: (total.words + total.phrases + total.sentences + total.terms) > 0 },
      { id: 'streak7', name: '一周不断', desc: '连续学习 7 天', on: computeStreak() >= 7 },
      { id: 'words100', name: '百词斩', desc: '见过 100 个单词', on: seenWord >= 100 },
      { id: 'words500', name: '五百里', desc: '见过 500 个单词', on: seenWord >= 500 },
      { id: 'trans20', name: '译路生花', desc: '完成 20 句翻译', on: (total.sentences || 0) >= 20 },
      { id: 'clear10', name: '错题清道夫', desc: '攻克 10 道错题', on: wrongList(true).filter(w => w.mastered).length >= 10 }
    ];
    return `${pageHead('stats', `<button class="pill-btn" data-route="settings">${icon('settings')}<span>设置</span></button>`)}
      <div class="stat-grid">
        <div class="card stat-card"><div class="metric"><b>${computeStreak()}</b><span>连续学习天数</span></div><div class="tag tag-accent mt-8">保持节奏</div></div>
        <div class="card stat-card"><div class="metric"><b>${seenWord}</b><span>见过的单词</span></div><div class="tag tag-teal mt-8">${pct(seenWord, WORDS.length)}% 词库覆盖</div></div>
        <div class="card stat-card"><div class="metric"><b>${acc}%</b><span>累计正确率</span></div><div class="tag tag-green mt-8">${total.correct || 0} 次答对</div></div>
        <div class="card stat-card"><div class="metric"><b>${total.sentences || 0}</b><span>累计翻译句数</span></div><div class="tag tag-gold mt-8">${doneSentence} 句已接触</div></div>
      </div>
      <div class="grid-2 mt-16">
        <section class="card chart-card">
          <div class="card-head"><div><h3 class="card-title">最近 14 天</h3><div class="card-sub">每日练习次数（词、词组、翻译、测试合计）</div></div><span class="tag">${days.reduce((a, b) => a + b.n, 0)} 次</span></div>
          <div class="big-chart">${bars}</div>
        </section>
        <section class="card chart-card">
          <div class="card-head"><div><h3 class="card-title">学习热力</h3><div class="card-sub">最近 28 天，颜色越深练得越多</div></div><span class="tag">${heat.filter(x => !x.includes('l0')).length} 天有记录</span></div>
          <div class="heatmap">${heat.map(x => x.replace(/title="[^"]*"/, '')).join('')}</div>
          <div class="heat-legend"><span>少</span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>多</span></div>
        </section>
      </div>
      <div class="grid-2 mt-16">
        <section class="card card-pad">
          <div class="card-head"><div><h3 class="card-title">掌握程度</h3><div class="card-sub">按记忆等级分布（L4 以上视为掌握）</div></div></div>
          <div class="progress-list">
            ${levels.map((n, l) => `<div><div class="progress-row"><span>${l === 0 ? '刚接触 / 未复习' : `L${l}`}</span><b>${n} 词</b></div><div class="progress" style="height:5px"><i style="width:${pct(n, WORDS.length)}%;${l >= 4 ? 'background:var(--green)' : ''}"></i></div></div>`).join('')}
          </div>
          <div class="divider"></div>
          <div class="row-between small"><span class="muted">已掌握单词</span><b>${masteredWord} / ${WORDS.length}</b></div>
        </section>
        <section class="card card-pad">
          <div class="card-head"><div><h3 class="card-title">进度概览</h3><div class="card-sub">词、词组、术语、翻译</div></div></div>
          <div class="progress-list">
            <div><div class="progress-row"><span>单词</span><b>${seenWord} / ${WORDS.length}</b></div><div class="progress" style="height:6px"><i style="width:${pct(seenWord, WORDS.length)}%"></i></div></div>
            <div><div class="progress-row"><span>词组</span><b>${seenPhrase} / ${PHRASES.length}</b></div><div class="progress" style="height:6px"><i style="width:${pct(seenPhrase, PHRASES.length)}%;background:var(--blue)"></i></div></div>
            <div><div class="progress-row"><span>文化术语</span><b>${seenTerm} / ${TERMS.length}</b></div><div class="progress" style="height:6px"><i style="width:${pct(seenTerm, TERMS.length)}%;background:var(--gold)"></i></div></div>
            <div><div class="progress-row"><span>翻译句子</span><b>${doneSentence} / ${SENTENCES.length}</b></div><div class="progress" style="height:6px"><i style="width:${pct(doneSentence, SENTENCES.length)}%;background:var(--accent)"></i></div></div>
            <div><div class="progress-row"><span>四级真题</span><b>${EXAMS.filter(e => examIsDone(e.id)).length} / ${EXAMS.length}</b></div><div class="progress" style="height:6px"><i style="width:${pct(EXAMS.filter(e => examIsDone(e.id)).length, EXAMS.length)}%;background:var(--primary)"></i></div></div>
          </div>
          <div class="divider"></div>
          <div class="row-between small"><span class="muted">待复习单词</span><b>${dueWordIds().length}</b></div>
        </section>
      </div>
      <section class="card card-pad mt-16">
        <div class="card-head"><div><h3 class="card-title">里程碑</h3><div class="card-sub">小目标一个个来</div></div><span class="tag">${achievements.filter(a => a.on).length} / ${achievements.length}</span></div>
        <div class="achievement-grid">
          ${achievements.map(a => `<div class="ach ${a.on ? 'on' : ''}"><div class="ach-ico">${icon(a.on ? 'spark' : 'target')}</div><div><b>${a.name}</b><span>${a.desc}</span></div></div>`).join('')}
        </div>
      </section>`;
  }

  /* ---------------- settings ---------------- */

    const s = state.settings;
    const usedBytes = (() => { try { return new Blob([localStorage.getItem(STORE_KEY) || '']).size; } catch { return 0; } })();
    return `${pageHead('settings', `<button class="pill-btn" data-action="toggle-theme">${icon(themeIsDark() ? 'sun' : 'moon')}<span>主题</span></button>`)}
      <div class="settings-wrap">
        <section class="card setting-card">
          <div class="card-head"><div><h3 class="card-title">每日计划</h3><div class="card-sub">量力而行，计划才会长久。修改后点“重新生成今日计划”可立即应用。</div></div></div>
          ${settingNumber('每天新词', '建议 20–30 个，备考初期从 15 个开始', 'dailyWords', s.dailyWords, 5, 100, 5)}

          </div>
        </section>

        <section class="card setting-card">
          <div class="card-head"><div><h3 class="card-title">学习偏好</h3><div class="card-sub">发音使用浏览器自带的语音合成，不需要联网加载音频。</div></div></div>
          <div class="setting-row">

            <button class="switch ${s.sound ? 'on' : ''}" data-action="toggle-sound" aria-label="切换发音"></button>
          </div>
